# 000-installer: text install, https-only Fedora mirrors, poweroff when done
# Repositories: fedora and updates, by metalink.
# Disables the initial-setup wizard and X configuration.

text
poweroff
# first boot is scripted by the kickstart, not by initial-setup
firstboot --disable
skipx

# protocol=https keeps plain-http mirrors out of the metalink answer: an
# http fetch names every package on the wire and the installer has no
# packet filter. The updates repo makes install-time packages current.
url --mirrorlist="https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=$basearch&protocol=https"
repo --name="updates" --mirrorlist="https://mirrors.fedoraproject.org/metalink?repo=updates-released-f$releasever&arch=$basearch&protocol=https"
