# 100-system: locale, timezone, DHCP without a hostname, enforcing SELinux
# No firewall command: anaconda installs firewalld for one, even disabled.

lang en_US.UTF-8
keyboard us
timezone @KS_TIMEZONE@ --utc

# No --hostname: the installer's NetworkManager would send it in DHCP.
network --bootproto=dhcp --device=link --activate

selinux --enforcing
# locked for good; admin access is sudo via wheel, recovery a live USB
rootpw --lock

%post --erroronfail --log=/root/ks-post-100-system.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/100-system.sh << 'VERIFY_EOF'
chk    "SELinux enforcing"                 test "$(getenforce)" = "Enforcing"
sh_chk "no firewalld package"              "! rpm -q firewalld"
# passwd -S prints one status field: P usable, NP none, L locked
sh_chk "root account locked"               "passwd -S root | grep -qE '^root L '"
VERIFY_EOF
%end
