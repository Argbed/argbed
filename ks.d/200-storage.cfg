# 200-storage: disk choice on tty3, UEFI check, LUKS2 root, hardened cmdline
# Writes /tmp/disk (ignoredisk, clearpart, bootloader, part) for %include
#   and /tmp/old-partuuids, the disk's partition UUIDs before any wipe.
# The LUKS passphrase is asked by anaconda and never written to a file.

%pre --erroronfail --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
exec < /dev/tty3 > /dev/tty3 2>&1
chvt 3

if [ ! -d /sys/firmware/efi ]; then
    echo "ERROR: booted in BIOS/CSM mode. This kickstart supports UEFI only."
    exit 1
fi

# lockdown=confidentiality blocks kernel-memory reads even for root;
# module.sig_enforce=1: signed modules only, Secure Boot on or off.
KERNEL_ARGS="audit=1 audit_backlog_limit=8192 init_on_alloc=1 init_on_free=1 slab_nomerge page_alloc.shuffle=1 randomize_kstack_offset=on vsyscall=none iommu.strict=1 lockdown=confidentiality module.sig_enforce=1"
# closes the pre-IOMMU DMA window but hangs rare firmware
#KERNEL_ARGS="$KERNEL_ARGS efi=disable_early_pci_dma"

while :; do
    echo
    echo "Disks and existing partitions (TRAN: nvme/sata/usb), check twice:"
    lsblk -e 7,11 -o NAME,SIZE,TYPE,TRAN,FSTYPE,LABEL,MODEL | grep -vi zram || true
    echo
    read -r -p "Install to which WHOLE disk (a name like sda or nvme0n1): " DISK
    DISK="${DISK#/dev/}"
    if [ ! -b "/dev/$DISK" ]; then
        echo "'/dev/$DISK' is not a block device."
        continue
    fi
    if [ ! -e "/sys/block/$DISK" ]; then
        echo "'/dev/$DISK' is a partition: name the whole disk (nvme0n1, not nvme0n1p1)."
        continue
    fi
    read -r -p "ALL DATA ON /dev/$DISK WILL BE DESTROYED. Type YES to confirm: " CONFIRM
    [ "$CONFIRM" = "YES" ] && break
done

# firmware boot entries of earlier installs on this disk reference these
( umask 077; lsblk -no PARTUUID "/dev/$DISK" | grep -v '^$' > /tmp/old-partuuids || true )

cat > /tmp/disk <<EOF
ignoredisk --only-use=$DISK
clearpart --all --initlabel --drives=$DISK
bootloader --boot-drive=$DISK --timeout=0 --append="$KERNEL_ARGS"
# 512 MiB: room for the whole boot chain and a second kernel image
part /boot/efi --fstype=efi --size=512 --ondisk=$DISK --fsoptions="umask=0077,shortname=winnt,nodev,nosuid,noexec"
# anaconda requires an unencrypted /boot for its bootloader step
part /boot --fstype=ext4 --size=512 --ondisk=$DISK --fsoptions="nodev,nosuid,noexec"
part / --fstype=ext4 --size=1 --grow --ondisk=$DISK --encrypted --luks-version=luks2
EOF

chvt 1
%end

%include /tmp/disk

%post --erroronfail --log=/root/ks-post-200-storage.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/200-storage.sh << 'VERIFY_EOF'
sh_chk "lockdown=confidentiality"          "grep -q '\\[confidentiality\\]' /sys/kernel/security/lockdown"
sh_chk "module signature enforcement"      "grep -q 'module.sig_enforce=1' /proc/cmdline"
sh_chk "no disk swap"                      "! swapon --show=NAME --noheadings | grep -qv zram"
VERIFY_EOF
%end
