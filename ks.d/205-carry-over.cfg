# 205-carry-over: payload/ beside the kickstart copied into the new system
# payload/keep -> /root/keep, whole, root-only: files to apply by hand.
# payload/bluetooth -> /var/lib/bluetooth where bluez made it, bond keys
#   only: each bonded device's info file and each controller's identity
#   file (its resolving key, which bonded LE peers need for its private
#   addresses); caches, GATT tables and adapter settings stay behind.
# Keys are bound to the controller, so they carry to the same machine only.
# The device is the one named by inst.ks=hd:<device>:<path>; an unlocked
#   LUKS stick is read from its mapped volume, a plain stick as it is.
# SELinux labels of restored paths are re-derived from the policy.

%pre --erroronfail --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
exec < /dev/tty3 > /dev/tty3 2>&1
chvt 3
# everything staged below is private from the moment it is created
umask 077

MNT=/mnt/ksusb
cleanup() { umount "$MNT" 2>/dev/null || true; }
trap cleanup EXIT

ks=$(tr ' ' '\n' < /proc/cmdline | sed -n 's/^inst\.ks=hd:\(.*\)$/\1/p' | head -1)
if [ -z "$ks" ]; then
    chvt 1
    exit 0
fi
spec="${ks%%:*}"
path="${ks#*:}"
[ "$path" != "$ks" ] || path=/ks.cfg
dev=""
case "$spec" in
    LABEL=*|UUID=*|PARTUUID=*|PARTLABEL=*) dev=$(blkid -t "$spec" -o device 2>/dev/null | head -1 || true) ;;
    /dev/*) dev="$spec" ;;
    *) dev="/dev/$spec" ;;
esac
if [ -z "$dev" ] || [ ! -b "$dev" ]; then
    echo "Kickstart device $spec not found: no payload."
    chvt 1
    exit 0
fi
mkdir -p "$MNT"
if ! mount -o ro,nodev,nosuid,noexec "$dev" "$MNT" 2>/dev/null; then
    echo "Could not mount the kickstart device $dev: no payload."
    chvt 1
    exit 0
fi
src="$MNT$(dirname "$path")/payload"
if [ -d "$src" ]; then
    echo
    echo "=== Payload on the kickstart device ==="
    if [ "$(lsblk -no TYPE "$dev" 2>/dev/null | head -1)" != "crypt" ]; then
        echo "$dev is not an encrypted volume: the payload on it is stored in clear."
    fi
    staged=0
    if [ -d "$src/keep" ]; then
        mkdir -p /tmp/carry/root
        cp -a "$src/keep" /tmp/carry/root/keep
        chmod -R go-rwx /tmp/carry/root/keep
        echo "/root" >> /tmp/carry.list
        echo "  staged payload/keep -> /root/keep"
        staged=1
    fi
    if [ -d "$src/bluetooth" ]; then
        # bond keys only; directory names are Bluetooth addresses
        n=0
        for adir in "$src"/bluetooth/*/; do
            a=$(basename "$adir")
            case "$a" in ??:??:??:??:??:??) ;; *) continue ;; esac
            dst="/tmp/carry/var/lib/bluetooth/$a"
            for ddir in "$adir"*/; do
                d=$(basename "$ddir")
                case "$d" in ??:??:??:??:??:??) ;; *) continue ;; esac
                [ -f "$ddir/info" ] || continue
                mkdir -p "$dst/$d"
                cp "$ddir/info" "$dst/$d/info"
                n=$((n+1))
            done
            if [ -f "$adir/identity" ]; then
                mkdir -p "$dst"
                cp "$adir/identity" "$dst/identity"
            fi
        done
        if [ "$n" -gt 0 ]; then
            echo "/var/lib/bluetooth" >> /tmp/carry.list
            echo "  staged payload/bluetooth -> /var/lib/bluetooth ($n bonded device(s))"
            staged=1
        else
            echo "payload/bluetooth holds no bonded device: nothing to carry."
        fi
    fi
    [ "$staged" = 1 ] || echo "payload/ holds nothing to carry."
fi
cleanup
chvt 1
%end

# Move the staged copies into the target before any chrooted %post runs
# (installer /tmp is invisible from the chroot). Each staged tree goes
# into a directory the new system has: bond keys only where bluez made it.
%post --nochroot --erroronfail --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
TARGET="${ANA_INSTALL_PATH:-/mnt/sysroot}"
[ -d "$TARGET/root" ] || TARGET=/mnt/sysimage
if [ -f /tmp/carry.list ]; then
    : > "$TARGET/root/.carried"
    chmod 600 "$TARGET/root/.carried"
    while IFS= read -r p; do
        [ -n "$p" ] || continue
        if [ -d "$TARGET$p" ]; then
            cp -a "/tmp/carry$p"/* "$TARGET$p/"
            echo "$p" >> "$TARGET/root/.carried"
        else
            echo "$p absent on the new system: its payload is not restored."
        fi
    done < /tmp/carry.list
    rm -rf /tmp/carry /tmp/carry.list
fi
%end

%post --erroronfail --log=/root/ks-post-205-carry-over.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

# The copies carry whatever labels they had on the USB; re-derive every
# restored path from this system's policy.
if [ -f /root/.carried ]; then
    while IFS= read -r p; do
        [ -n "$p" ] || continue
        restorecon -RF "$p"
        echo "relabeled $p"
    done < /root/.carried
    rm -f /root/.carried
fi
%end
