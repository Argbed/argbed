# 210-disk-wipe: optional sanitizing of the chosen disk, each step y/N
# 1. LUKS headers of earlier installs: the first 32 MiB of every
#    crypto_LUKS partition is overwritten, so the data cannot be unlocked;
#    a remapped copy of the header on an SSD needs step 2.
# 2. The drive's own erase, which reaches cells an overwrite cannot:
#    nvme format --ses=1, or ATA SECURITY ERASE UNIT (enhanced when
#    supported) unless the firmware froze the drive or a drive password
#    is set; USB bridges pass no erase command. An interrupted ATA erase
#    leaves the drive locked with password "p":
#    hdparm --user-master u --security-disable p /dev/X
# 3. shred: N random passes and/or a final pass of zeros over the disk.
# Reads the disk name from 200-storage's /tmp/disk.

%pre --erroronfail --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
exec < /dev/tty3 > /dev/tty3 2>&1
chvt 3

ask() {
    local a
    read -r -p "$1 [y/N] " a
    case "$a" in
        y|Y) return 0 ;;
        *)   return 1 ;;
    esac
}

tgtdisk=$(awk -F= '/^ignoredisk --only-use=/{print $2}' /tmp/disk 2>/dev/null || true)
dev="/dev/$tgtdisk"
if [ -z "$tgtdisk" ] || [ ! -b "$dev" ]; then
    chvt 1
    exit 0
fi

echo
echo "=== Wipe $dev before installation ==="

# 1. LUKS headers
luks=$(lsblk -lno NAME,FSTYPE "$dev" 2>/dev/null | awk '$2=="crypto_LUKS"{print $1}' || true)
if [ -n "$luks" ]; then
    echo "Encrypted volumes on the disk: $(echo $luks)"
    if ask "Destroy their LUKS headers (data unrecoverable at once)?"; then
        for p in $luks; do
            shred -n 1 -z -s 32M "/dev/$p"
            echo "  /dev/$p: header erased"
        done
    fi
fi

# 2. The drive's own erase
tran=$(lsblk -dno TRAN "$dev" 2>/dev/null || true)
case "$tran" in
    nvme)
        if ask "Run the drive's own erase (nvme format, user-data erase)?"; then
            nvme format "$dev" --ses=1 --force --timeout=1800000
            echo "  drive erase complete"
        fi
        ;;
    sata|ata)
        sec=$(hdparm -I "$dev" 2>/dev/null | sed -n '/^Security:/,/^[A-Z]/p' || true)
        if ! echo "$sec" | grep -qE '^[[:space:]]+supported$'; then
            echo "ATA secure erase: not supported by this drive."
        elif echo "$sec" | grep -qE '^[[:space:]]+frozen$'; then
            echo "ATA secure erase skipped: the firmware froze the drive (a suspend/resume cycle unfreezes it)."
        elif echo "$sec" | grep -qE '^[[:space:]]+enabled$'; then
            echo "ATA secure erase skipped: a drive password is already set."
        elif ask "Run the drive's own erase (ATA SECURITY ERASE UNIT)?"; then
            hdparm --user-master u --security-set-pass p "$dev"
            if echo "$sec" | grep -q 'supported: enhanced erase'; then
                hdparm --user-master u --security-erase-enhanced p "$dev"
            else
                hdparm --user-master u --security-erase p "$dev"
            fi
            echo "  drive erase complete"
        fi
        ;;
    usb)
        echo "USB device: no erase command passes the bridge; overwrite is the only option."
        ;;
    *)
        echo "Drive erase: no method for transport '${tran:-unknown}'."
        ;;
esac

# 3. Overwrite: random passes and a zeros pass are independent choices
echo "Passes of random data over the WHOLE disk (0 = none)."
while :; do
    read -r -p "Passes: " ROUNDS
    [[ "$ROUNDS" =~ ^[0-9]+$ ]] && break
    echo "Enter a number."
done
zero_flag=""
if ask "Finish with one pass of zeros over the WHOLE disk?"; then
    zero_flag="-z"
fi
if [ "$ROUNDS" -gt 0 ] || [ -n "$zero_flag" ]; then
    echo "Overwriting $dev: $ROUNDS random pass(es)${zero_flag:+ + one pass of zeros}..."
    shred -v -n "$ROUNDS" $zero_flag "$dev"
    echo "Overwrite complete."
fi

chvt 1
%end
