# 300-packages: the whole base package set, no @core, no weak dependencies
# Every %packages header in every module repeats these flags: a later plain
#   header resets them to the defaults.
# GRUB is not listed: anaconda installs grub2-efi-x64 for its bootloader
#   step, and shim-x64 hard-requires it.
# Packages that look optional and are not: README, "The --nocore base".

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
# --- boot chain (x86_64 UEFI names)
kernel
dracut
shim-x64
efibootmgr
# vendor firmware (GPU, WiFi, Bluetooth, audio DSP, CPU microcode) comes
# as packages linux-firmware at most recommends; the token expands to the
# ones named in build.conf, and unnamed hardware runs without firmware
linux-firmware
@KS_FIRMWARE@
wireless-regdb

# --- storage / filesystems
cryptsetup
e2fsprogs
dosfstools

# --- init + core userspace
systemd
systemd-pam
systemd-udev
dbus-broker
util-linux
bash
coreutils
grep
sed
gawk
findutils
less
procps-ng
kbd
rootfiles
tzdata
glibc-langpack-en

# --- accounts / auth
#     shadow-utils owns /usr/bin/passwd; there is no passwd package
shadow-utils
sudo
authselect
# pam_pwquality is requisite in the password stack and needs the cracklib
# dictionary; nothing else pulls it in
cracklib-dicts

# --- security
selinux-policy-targeted
policycoreutils
libselinux-utils
audit
nftables

# --- network
systemd-networkd
iwd
iproute
chrony
ca-certificates

# --- package management
dnf5
rpm
fedora-release
fedora-repos
basesystem

# --- memory
zram-generator-defaults
%end

%post --erroronfail --log=/root/ks-post-300-packages.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/300-packages.sh << 'VERIFY_EOF'
sh_chk "no sshd present"                   "! systemctl list-unit-files sshd.service 2>/dev/null | grep -q sshd"
sh_chk "zram swap active"                  "swapon --show=NAME --noheadings | grep -q zram"
VERIFY_EOF
%end
