# 400-dnf: dnf policy, https-only mirrors, first full upgrade, one kernel
# Sets install_weak_deps=False and installonly_limit=2, turns countme off,
#   pins the Fedora metalinks to https mirrors, upgrades everything.
# Removes every kernel but the newest; prune-old-kernels.service removes
#   the non-running kernel at each boot.
# Selects the PAM profile local with-faillock.

%post --erroronfail --log=/root/ks-post-400-dnf.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

# The %packages flags govern only anaconda's transaction; the installed
# system's dnf follows the same no-weak-deps policy for every later %post
# and every future install.
grep -q '^install_weak_deps=' /etc/dnf/dnf.conf 2>/dev/null \
    || echo 'install_weak_deps=False' >> /etc/dnf/dnf.conf

# Cap parallel-installed kernels at 2, dnf's minimum for installonly
# packages (the Fedora default keeps 3). The prune-old-kernels service
# below brings the system back to exactly one kernel after each update.
grep -q '^installonly_limit=' /etc/dnf/dnf.conf 2>/dev/null \
    || echo 'installonly_limit=2' >> /etc/dnf/dnf.conf

# Fedora's repo files enable countme; repo values override [main], so the
# off switch goes through libdnf5's override directory, which also covers
# repos added later. No mkdir: a moved path must fail the install loudly.
cat > /etc/dnf/repos.override.d/99-countme.repo << 'EOF'
[*]
countme=0
EOF

# protocol=https keeps plain-http mirrors out of the metalink answer for
# the lifetime of the system. Appended in place: an override cannot extend
# a URL, and the repo files are config(noreplace).
sed -i '/^metalink=/ s/$/\&protocol=https/' /etc/yum.repos.d/fedora*.repo

dnf clean all
dnf -y --refresh upgrade

# An older kernel that stays bootable is a signed downgrade path into
# patched flaws. protect_running_kernel means the INSTALLER's kernel here,
# which can be the version removed.
old_kernels=$(rpm -q kernel-core --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort -V | head -n -1)
for v in $old_kernels; do
    dnf -y remove --setopt=protect_running_kernel=false "kernel-core-$v"
done

# After an update dnf keeps the previous kernel. At every boot this removes
# the kernels other than the running one, so a kernel is pruned only once
# another has booted; no repository is consulted (removal needs none).
cat > /usr/local/sbin/prune-old-kernels << 'EOF'
#!/usr/bin/bash
set -euo pipefail
run=$(uname -r)
rpm -q "kernel-core-$run" >/dev/null 2>&1 || exit 0
for name in kernel-core kernel-devel; do
    rpm -q "$name" >/dev/null 2>&1 || continue
    for v in $(rpm -q "$name" --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' | grep -vxF "$run" || true); do
        dnf -y remove --disablerepo='*' "$name-$v"
    done
done
EOF
chmod 700 /usr/local/sbin/prune-old-kernels

cat > /etc/systemd/system/prune-old-kernels.service << 'EOF'
[Unit]
Description=Remove kernels other than the running one

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/prune-old-kernels

[Install]
WantedBy=multi-user.target
EOF
systemctl enable prune-old-kernels.service

# --nocore install: the authselect rpm selects a default profile on fresh
# installs; run explicitly so a regression there cannot ship a system
# nobody can log in to. with-faillock locks the account after bad passwords.
authselect select local with-faillock --force

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/400-dnf.sh << 'VERIFY_EOF'
sh_chk "dnf weak deps disabled"            "grep -q '^install_weak_deps=False' /etc/dnf/dnf.conf"
# effective config, not the override file: a file grep only proves the
# file exists, not that libdnf5 reads that path
sh_chk "dnf countme disabled (effective)"  "dnf5 -q --dump-repo-config='*' | grep -qi countme && ! dnf5 -q --dump-repo-config='*' | grep -i countme | grep -qv '= 0'"
# every metalink of every repo, third-party repositories included
sh_chk "dnf mirrors https-only"            "grep -q '^metalink=' /etc/yum.repos.d/fedora*.repo && ! grep -h '^metalink=' /etc/yum.repos.d/*.repo | grep -qv protocol=https"
sh_chk "kernel prune service enabled"      "systemctl is-enabled prune-old-kernels.service"
sh_chk "faillock brute-force lockout"      "authselect current | grep -q with-faillock"
VERIFY_EOF
%end
