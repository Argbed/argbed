# 410-network: systemd-networkd and iwd, random MACs, anonymous DHCP
# Writes /etc/hostname; DHCP sends no hostname, client-id or option
#   fingerprint and takes no pushed routes; IPv6 RA off; wired MAC random
#   per boot by .link, WiFi MAC random per boot by iwd.
# Masks systemd-resolved: resolv.conf is a static file.
# Removes the NetworkManager profiles anaconda copies in from the installer.
# wait-online waits for any one link, 30 s at most.

%post --erroronfail --log=/root/ks-post-410-network.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

# Written here, not via the kickstart network command: the installer's
# NetworkManager sends the hostname in DHCP requests, while this config
# (Anonymize=true below) never does.
echo '@KS_HOSTNAME@' > /etc/hostname
chmod 644 /etc/hostname
# A file created in /etc inherits etc_t; this file's canonical context
# is hostname_etc_t (the type hostnamed manages it by), so it is pinned.
restorecon /etc/hostname

mkdir -p /etc/systemd/network

# Anonymize=true is RFC 7844: no hostname, client-id or option fingerprint.
# UseRoutes=no: a pushed route (option 121) more specific than the VPN's
# policy routes would steer traffic around the tunnel; the gateway stays.
cat > /etc/systemd/network/20-wired.network << 'EOF'
[Match]
Name=en* eth*

[Network]
DHCP=ipv4
IPv6AcceptRA=no

[DHCPv4]
Anonymize=true
UseRoutes=no
UseGateway=yes
EOF

cat > /etc/systemd/network/25-wifi.network << 'EOF'
[Match]
Name=wl*

[Network]
DHCP=ipv4
IPv6AcceptRA=no

[DHCPv4]
Anonymize=true
UseRoutes=no
UseGateway=yes
EOF

# Random MAC for wired NICs each boot; MACAddressPolicy belongs in [Link].
# WiFi is iwd's (a udev policy would race it). NamePolicy repeats systemd's
# default because this file replaces 99-default.link for its matches.
cat > /etc/systemd/network/70-ether-random-mac.link << 'EOF'
[Match]
Type=ether

[Link]
NamePolicy=keep kernel database onboard slot path
MACAddressPolicy=random
EOF

# iwd: per-boot MAC randomization, no DNS integration (resolv.conf is a
# static file)
mkdir -p /etc/iwd
cat > /etc/iwd/main.conf << 'EOF'
[General]
AddressRandomization=once

[Network]
NameResolvingService=none
EOF

# systemd-resolved is not installed, but Fedora's preset enables it, so a
# dependency pulling it in later would start a stub resolver. A mask
# outlives that; a disable has no symlink to remove before the package exists.
systemctl mask systemd-resolved.service

systemctl enable systemd-networkd iwd

# Enabling networkd also enables wait-online (Install Also=). Stock waits
# for EVERY managed link, so an empty port keeps the boot "not online" for
# 120 s and then fails the unit; --any and a 30 s bound avoid that.
mkdir -p /etc/systemd/system/systemd-networkd-wait-online.service.d
cat > /etc/systemd/system/systemd-networkd-wait-online.service.d/50-any-link.conf << 'EOF'
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
EOF

# anaconda copies the installer's NetworkManager profiles into the new
# system, a WiFi passphrase typed during the install among them; no
# NetworkManager is installed to read them
rm -rf /etc/NetworkManager

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/410-network.sh << 'VERIFY_EOF'
sh_chk "canonical label on /etc/hostname"  "matchpathcon -V /etc/hostname"
sh_chk "no installer network profiles"     "! test -e /etc/NetworkManager"
sh_chk "systemd-resolved masked"           "systemctl is-enabled systemd-resolved.service 2>&1 | grep -qx masked"
sh_chk "MAC randomization (wired) config"  "grep -q 'MACAddressPolicy=random' /etc/systemd/network/70-ether-random-mac.link"
VERIFY_EOF
%end
