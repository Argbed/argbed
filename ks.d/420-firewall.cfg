# 420-firewall: nftables, default-drop inbound and outbound
# Egress: DHCP renewals, DNS to the static resolvers only, NTP, HTTPS and
#   QUIC; anything else (VPN endpoints, plain HTTP) is added here.
# networkd requires nftables.service: no loaded ruleset, no network.

%post --erroronfail --log=/root/ks-post-420-firewall.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

( umask 077; cat > /etc/sysconfig/nftables.conf << 'EOF'
flush ruleset
table inet filter {
    chain input {
        type filter hook input priority 0;
        policy drop;
        ct state established,related accept
        iif "lo" accept
    }
    chain output {
        type filter hook output priority 0;
        policy drop;
        oif "lo" accept
        ct state established,related accept

        udp sport 68 udp dport 67 accept comment "DHCPv4 client renewals"
        # Pinned to the static resolvers: port 53 elsewhere is an
        # exfiltration channel. A VPN that puts another resolver into
        # resolv.conf adds its IP here.
        ip daddr { @KS_RESOLVERS@ } udp dport 53 accept comment "DNS"
        ip daddr { @KS_RESOLVERS@ } tcp dport 53 accept comment "DNS over TCP"
        udp dport 123 accept comment "NTP (chrony)"
        tcp dport 443 accept comment "HTTPS"
        udp dport 443 accept comment "HTTP/3 QUIC"
        # tcp dport 80 accept comment "plain-HTTP dnf mirrors, captive portals"
        # tcp dport 22 accept comment "ssh, git over ssh"
        # icmp type echo-request accept comment "outbound ping (needs iputils)"
    }
    chain forward {
        type filter hook forward priority 0;
        policy drop;
    }
}
EOF
)

systemctl enable nftables

# nft -f is one transaction: on any error nothing loads, and the stock unit
# only orders itself before network-pre.target; Requires= closes that gap
# (a restart of nftables restarts networkd).
install -d /etc/systemd/system/systemd-networkd.service.d
cat > /etc/systemd/system/systemd-networkd.service.d/50-firewall-first.conf << 'EOF'
[Unit]
Requires=nftables.service
After=nftables.service
EOF

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/420-firewall.sh << 'VERIFY_EOF'
sh_chk "nftables active"                   "systemctl is-active nftables"
sh_chk "networkd requires nftables"        "systemctl show systemd-networkd -p Requires | grep -q nftables.service"
sh_chk "ingress default-drop loaded"       "nft list chain inet filter input | grep -q 'policy drop'"
sh_chk "egress default-drop loaded"        "nft list chain inet filter output | grep -q 'policy drop'"
# every port-53 accept must carry a daddr pin: an unpinned one is an
# exfiltration channel to any host, not name resolution
sh_chk "DNS egress pinned to resolvers"    "! nft list chain inet filter output | grep 'dport 53' | grep -qv daddr"
VERIFY_EOF
%end
