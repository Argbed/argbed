# 430-hardening: sysctl set, IPv6 off, no core dumps, capture lockout
# User namespaces stay enabled: browser sandboxes need them.
# Capture nodes (v4l, ALSA capture PCMs) are mode 0000 without the seat ACL;
#   uvcvideo never loads.

%post --erroronfail --log=/root/ks-post-430-hardening.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

cat > /etc/sysctl.d/99-hardening.conf << 'EOF'
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
kernel.yama.ptrace_scope = 2
kernel.kexec_load_disabled = 1
kernel.sysrq = 0
kernel.perf_event_paranoid = 3
net.core.bpf_jit_harden = 2
dev.tty.ldisc_autoload = 0
vm.mmap_rnd_bits = 32
vm.unprivileged_userfaultfd = 0
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.suid_dumpable = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
EOF

cat > /etc/sysctl.d/99-ipv6-disable.conf << 'EOF'
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
EOF

# No core dumps: systemd-coredump drop-in (it overrides suid_dumpable and
# core_pattern on its own, so the sysctl alone is not enough) + PAM limits.
mkdir -p /etc/systemd/coredump.conf.d
cat > /etc/systemd/coredump.conf.d/99-disable.conf << 'EOF'
[Coredump]
Storage=none
ProcessSizeMax=0
EOF
echo "* hard core 0" >> /etc/security/limits.conf
# systemd ships no coredump.conf.d directory, so the mkdir above created
# it inheriting /etc/systemd's etc_t; the canonical type is
# systemd_conf_t, so directory and drop-in are pinned.
restorecon -R /etc/systemd/coredump.conf.d

# a camera works again once no-webcam.conf and the udev rule below are
# gone and the system rebooted
echo "install uvcvideo /bin/false" > /etc/modprobe.d/no-webcam.conf
chmod 644 /etc/modprobe.d/no-webcam.conf
# udev's uaccess builtin grants the seat user an ACL on every tagged node,
# queued by 73-seat-late.rules; the tag goes before that, so the mode holds
# for every unprivileged process
cat > /etc/udev/rules.d/72-privacy-capture.rules << 'EOF'
SUBSYSTEM=="video4linux", TAG-="uaccess", MODE="0000"
SUBSYSTEM=="sound", KERNEL=="pcmC*D*c", TAG-="uaccess", MODE="0000"
EOF

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/430-hardening.sh << 'VERIFY_EOF'
sh_chk "sysctl hardening applied"          "test \"\$(sysctl -n kernel.kptr_restrict)\" = 2"
sh_chk "core dumps disabled"               "test \"\$(sysctl -n fs.suid_dumpable)\" = 0 && test -f /etc/systemd/coredump.conf.d/99-disable.conf"
sh_chk "canonical label on coredump.conf.d" "matchpathcon -V /etc/systemd/coredump.conf.d"
sh_chk "webcam driver blacklisted"         "test -f /etc/modprobe.d/no-webcam.conf && ! lsmod | grep -q '^uvcvideo'"
sh_chk "IPv6 disabled"                     "test \"\$(sysctl -n net.ipv6.conf.all.disable_ipv6)\" = 1"
# a node the seat user may open through logind's ACL shows a + in ls -l
sh_chk "capture nodes closed (mode 0000, no ACL)" "for d in /dev/video* /dev/snd/pcmC*D*c; do [ -e \"\$d\" ] || continue; [ \"\$(stat -c %a \"\$d\")\" = 0 ] || exit 1; ls -l \"\$d\" | grep -q '^c.........+' && exit 1; done; exit 0"
VERIFY_EOF
%end
