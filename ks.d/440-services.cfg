# 440-services: enables auditd and chronyd, disables systemd-homed
# zram needs no enable: the generator's unit has no [Install] section.
# systemd-homed is disabled: the accounts are plain useradd ones, with no
#   home area for it to manage.
# Kept running: rtkit-daemon, pipewire's realtime scheduling helper, and
#   systemd-oomd, which ends a thrashing session above the zram swap.
# A module whose dependencies bring in another daemon disables it itself.

%post --erroronfail --log=/root/ks-post-440-services.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

systemctl enable auditd chronyd
systemctl disable systemd-homed.service systemd-homed-activate.service

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/440-services.sh << 'VERIFY_EOF'
sh_chk "auditd active"                     "systemctl is-active auditd"
sh_chk "chronyd active (sane clock)"       "systemctl is-active chronyd"
sh_chk "systemd-homed disabled"            "! systemctl is-enabled -q systemd-homed.service"
VERIFY_EOF
%end
