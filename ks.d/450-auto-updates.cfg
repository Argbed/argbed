# 450-auto-updates: every boot updates the system on tty1 before login
# Downloads and installs all pending updates, then reboots, so nothing
#   updated keeps running; Ctrl+C in the wait/download phase skips to login,
#   the rpm transaction ignores console keys; offline boots reach login
#   after about 30 s.
# Update traffic happens only in this pre-session window, after a route
#   to the mirrors exists: every login prompt, tty1 and the consoles
#   logind spawns, is ordered after the updater, and dnf-makecache.timer
#   is disabled, so the window's own refresh is the only metadata fetch.
# dnf5-plugin-automatic is not used: it applies updates into a running
#   session and offers no skip.

%post --erroronfail --log=/root/ks-post-450-auto-updates.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

cat > /usr/local/sbin/boot-update << 'BOOT_UPDATE_SH'
#!/usr/bin/bash
# Runs on tty1 before getty on every boot. Every failure path falls
# through to login: a usable system on yesterday's packages beats a
# blocked boot, and the next boot tries again.
set -uo pipefail
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

# Ctrl+C skips while skipping is safe; Ctrl+Z and Ctrl+\ are ignored, a
# suspended updater would hang the boot (getty waits on this unit).
# Ignored dispositions are inherited, so dnf runs under the same rule.
trap '' QUIT TSTP
trap 'echo; echo "Skipped: the next boot will try again."; exit 0' INT

echo "=== boot update (Ctrl+C skips) ==="

# Wait for a route to the mirrors: DHCP, and the VPN tunnel on a
# machine whose egress is pinned to one, may still be coming up.
net_ok=""
for _ in {1..10}; do
    if timeout 2 bash -c 'exec 3<>/dev/tcp/mirrors.fedoraproject.org/443' 2>/dev/null; then
        net_ok=1; break
    fi
    sleep 1
done
if [ -z "$net_ok" ]; then
    echo "Mirrors unreachable (no network yet, or no VPN tunnel up): continuing to login, the next boot will try again."
    exit 0
fi

# Download phase, skippable: finished packages stay in the dnf cache,
# so a skip loses nothing. The install below then needs no network.
echo "Checking for and downloading updates (this can take a while)..."
if ! dnf5 -y upgrade --downloadonly --refresh; then
    echo "WARNING: update download failed, continuing to login (details: journalctl -u boot-update)."
    exit 0
fi

# Install phase, from here on Ctrl+C is ignored too: an interrupted
# rpm transaction can leave packages half-installed.
trap '' INT

# The reboot is reachable only behind a transaction this run performs:
# exit 0 = nothing pending, straight to login, so a reboot loop cannot
# happen; 100 = updates pending.
rc=0
dnf5 -q --cacheonly check-upgrade >/dev/null 2>&1 || rc=$?
if [ "$rc" -eq 0 ]; then
    echo "System is up to date."
    exit 0
elif [ "$rc" -ne 100 ]; then
    echo "WARNING: update check failed, continuing to login (details: journalctl -u boot-update)."
    exit 0
fi

if ! dnf5 -y --cacheonly upgrade; then
    echo "WARNING: update install failed, continuing to login (details: journalctl -u boot-update)."
    exit 0
fi

# a reboot after every transaction: no updated kernel, library or service
# keeps running stale code, and no heuristic decides
echo "Updates installed: rebooting in 5 seconds."
sleep 5
systemctl reboot
BOOT_UPDATE_SH
chmod 700 /usr/local/sbin/boot-update

cat > /etc/systemd/system/boot-update.service << 'EOF'
[Unit]
Description=Boot-time system update
After=systemd-user-sessions.service

[Service]
Type=oneshot
RemainAfterExit=no

StandardInput=tty-force
StandardOutput=journal+console
StandardError=journal+console
TTYPath=/dev/tty1

ExecStart=/usr/local/sbin/boot-update

[Install]
WantedBy=multi-user.target
EOF

systemctl enable boot-update.service

# Every login prompt waits: autovt@ aliases this template, so the consoles
# logind spawns are covered. Ordering, not Conflicts=, since getty@tty1 is
# only Wants-pulled and a Conflicts= would delete its start job outright.
install -d /etc/systemd/system/getty@.service.d
cat > /etc/systemd/system/getty@.service.d/50-after-boot-update.conf << 'EOF'
[Unit]
After=boot-update.service
EOF

# the updater refreshes the metadata itself; the stock timer would fetch
# during sessions
systemctl disable dnf-makecache.timer

# The kernel pruner (400-dnf) must finish before this updater starts: a
# kernel installed in this boot has to survive until the next one, and
# both must never contend for the dnf lock.
install -d /etc/systemd/system/prune-old-kernels.service.d
cat > /etc/systemd/system/prune-old-kernels.service.d/50-before-boot-update.conf << 'EOF'
[Unit]
Before=boot-update.service
EOF

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/450-auto-updates.sh << 'VERIFY_EOF'
sh_chk "boot-time updates enabled"         "systemctl is-enabled boot-update.service"
sh_chk "login prompts wait for the updater" "systemctl show getty@tty1.service -p After | grep -q boot-update.service"
sh_chk "no dnf metadata timer"             "! systemctl is-enabled -q dnf-makecache.timer"
VERIFY_EOF
%end
