# 500-uki-boot: signed UKIs via shim and sd-boot, GRUB has no boot entry
# A machine-local key is generated in %post (/etc/pki/uki, encrypted root)
#   and, where the firmware has Secure Boot, queued for MOK enrollment
#   through the stock shim; firmware CAs are not touched. Chain: firmware
#   -> shim (EFI/uki) -> sd-boot signed as grubx64.efi -> UKI in EFI/Linux,
#   cmdline inside the signature.
# kernel-install layout=uki with dracut signing builds a UKI per kernel;
#   a plugin refreshes the shim copy and re-signs sd-boot on each install.
# GRUB stays installed (shim-x64 requires it) but has no boot entry, no
#   grub.cfg and masked plugins. Recovery: /root/uki-notes.txt.
# %pre: Secure Boot check, stale boot entries and keys to delete, the MOK
#   password. Entries of earlier installs go by 200-storage's partition UUIDs.

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
systemd-boot-unsigned
sbsigntools
# objcopy, used by dracut --uefi to assemble the UKI
binutils
openssl
mokutil
%end

# Own %pre: this module collects its own inputs, so removing the module
# removes the prompt AND the staged secret with it: no orphaned password
# file can ever exist. Runs after 200-storage's %pre (lexical order).
%pre --erroronfail --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
exec < /dev/tty3 > /dev/tty3 2>&1
chvt 3
# every file staged below is private from the moment it is created
umask 077

# Firmware settings cannot be changed from a kickstart; the install
# refuses to proceed quietly. An ABSENT variable means no Secure Boot
# implementation: mokutil then refuses every enrollment operation.
sb_state=0
sb_supported=0
sb_var=/sys/firmware/efi/efivars/SecureBoot-8be4df61-93ca-11d2-aa0d-00e098032b8c
if [ -r "$sb_var" ]; then
    sb_supported=1
    sb_state=$(od -An -tu1 -j4 -N1 "$sb_var" | tr -d ' ')
fi
if [ "$sb_state" != "1" ]; then
    if [ "$sb_supported" = "1" ]; then
        echo "WARNING: Secure Boot is DISABLED in firmware."
        echo "Enable it in firmware setup for a verified boot chain."
    else
        echo "WARNING: this firmware has NO Secure Boot implementation (no"
        echo "SecureBoot variable). The chain still boots through shim, but the"
        echo "firmware never verifies it, the signing key cannot be MOK-enrolled"
        echo "(mokutil refuses without the variable), and kernel modules signed"
        echo "with the machine key stay untrusted and will not load."
    fi
    read -r -p "Type YES to continue without Secure Boot: " SBOK
    [ "$SBOK" = "YES" ] || exit 1
fi

# Entries from wiped or retired disks may linger in NVRAM (some firmware
# hides them, some prunes them). Only entries named here are deleted;
# earlier installs on the chosen disk are removed later by partition UUID.
echo
echo "=== Existing firmware boot entries ==="
efibootmgr 2>/dev/null | grep -E '^Boot[0-9A-F]{4}' || echo "(none readable)"
echo
echo "Enter entry numbers to DELETE, space-separated (like 0003 0007), or"
echo "press Enter to keep all. Deleting an entry does NOT touch that disk's"
echo "data, but do not delete entries you don't recognize."
read -r -p "> " DELETE_LIST
for num in $DELETE_LIST; do
    num="${num#Boot}"
    if [[ "$num" =~ ^[0-9A-Fa-f]{4}$ ]]; then
        efibootmgr -B -b "$num" >/dev/null \
            && echo "Deleted Boot$num." \
            || echo "Could not delete Boot$num, skipped."
    else
        echo "'$num' is not a 4-digit entry number, skipped."
    fi
done

# No password on firmware without Secure Boot support: mokutil cannot
# queue an enrollment there, so the password would be a staged secret
# with no consumer.
if [ "$sb_supported" = "1" ]; then
    # Every install enrolls a fresh key and the firmware keeps each one
    # until deleted (small variable storage). A deleted key leaves its
    # disk unbootable under Secure Boot; deletion is queued in %post.
    echo
    echo "=== Secure Boot keys enrolled by earlier installs (MOK list) ==="
    mokutil --list-enrolled 2>/dev/null | awk '
        function flush() { if (ours) printf "%s|%s|%s|%s\n", n, lb, nb, fp }
        /^\[key [0-9]+\]/ { flush(); n=$2; sub(/\]/,"",n); ours=0; lb=""; nb=""; fp="" }
        /SHA1 Fingerprint:/ { fp=$0; sub(/.*SHA1 Fingerprint: */,"",fp) }
        /Not Before:/ { nb=$0; sub(/.*Not Before: */,"",nb) }
        /Subject: CN=Secure Boot Signing Key(, OU=|$)/ { ours=1; lb=$0; if (!sub(/.*, OU=/,"",lb)) lb="-" }
        END { flush() }' > /tmp/mok-ours || true
    if [ -s /tmp/mok-ours ]; then
        awk -F'|' '{printf "  key %s  %s  created %s  %s\n", $1, $2, $3, $4}' /tmp/mok-ours
        echo
        echo "Enter key numbers to DELETE, space-separated, or press Enter to keep all."
        echo "A deleted key leaves its disk unbootable under Secure Boot until re-enrolled."
        read -r -p "> " MOK_DELETE
        if [ -n "$MOK_DELETE" ]; then
            exp=$(mktemp -d)
            (cd "$exp" && mokutil --export >/dev/null 2>&1) || true
            mkdir -p /tmp/mok-del
            for num in $MOK_DELETE; do
                if [[ "$num" =~ ^[0-9]+$ ]] \
                        && awk -F'|' -v k="$num" '$1==k{f=1} END{exit !f}' /tmp/mok-ours \
                        && [ -f "$exp/MOK-$(printf '%04d' "$num").der" ]; then
                    cp "$exp/MOK-$(printf '%04d' "$num").der" /tmp/mok-del/
                    echo "Key $num will be deleted."
                else
                    echo "'$num' is not a listed key number, skipped."
                fi
            done
            rm -rf "$exp"
            chmod 700 /tmp/mok-del
        fi
    else
        echo "(none)"
    fi
    rm -f /tmp/mok-ours
    echo
    echo "=== Secure Boot key (MOK) enrollment password ==="
    echo "shim's key-enrollment screen (MokManager) should appear on the first"
    echo "boot, before the OS. Enroll the key there with the password you set now"
    echo "(typical menus: Enroll MOK -> Continue -> Yes; wording varies by shim version)."
    echo "WARNING: with Secure Boot on, skipping or deleting that request leaves"
    echo "the system UNBOOTABLE until the key is enrolled (recovery: live USB)."
    while :; do
        read -r -s -p "MOK one-time password (8-16 chars): " MOKPW; echo
        read -r -s -p "Confirm: " MOKPW2; echo
        [ "$MOKPW" = "$MOKPW2" ] || { echo "Mismatch, try again."; continue; }
        [ "${#MOKPW}" -ge 8 ] && [ "${#MOKPW}" -le 16 ] && break
        echo "Must be 8-16 characters."
    done
    printf '%s' "$MOKPW" > /tmp/mok-pw
    chmod 600 /tmp/mok-pw
fi

chvt 1
%end

# Stage the MOK password chosen in %pre into the target (installer /tmp is
# not visible from the chrooted main %post).
%post --nochroot --erroronfail --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
TARGET="${ANA_INSTALL_PATH:-/mnt/sysroot}"
[ -d "$TARGET/root" ] || TARGET=/mnt/sysimage
# the installer image ships no install(1); cp opens each new file at its
# final mode under this umask
umask 077
if [ -f /tmp/mok-pw ]; then
    cp /tmp/mok-pw "$TARGET/root/.mok-pw"
    rm -f /tmp/mok-pw
fi
if [ -f /tmp/old-partuuids ]; then
    cp /tmp/old-partuuids "$TARGET/root/.old-partuuids"
    rm -f /tmp/old-partuuids
fi
if [ -d /tmp/mok-del ]; then
    cp -a /tmp/mok-del "$TARGET/root/.mok-del"
    rm -rf /tmp/mok-del
fi
%end

%post --erroronfail --log=/root/ks-post-500-uki-boot.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

ESP=/boot/efi
[ -f "$ESP/EFI/fedora/shimx64.efi" ] || { echo "ERROR: shim not found on ESP"; exit 1; }

# --- machine-local signing key (never leaves the encrypted root) ---
install -d -m 700 /etc/pki/uki
if [ ! -f /etc/pki/uki/uki.key ]; then
    # A generic CN: sbsign embeds this certificate in every binary on the
    # plain ESP; the boot label as OU tells the keys of different disks apart.
    openssl req -new -x509 -newkey rsa:4096 -sha256 -days 3650 -nodes \
        -subj "/CN=Secure Boot Signing Key/OU=@KS_BOOT_LABEL@/" \
        -keyout /etc/pki/uki/uki.key -out /etc/pki/uki/uki.crt 2>/dev/null
    openssl x509 -in /etc/pki/uki/uki.crt -outform DER -out /etc/pki/uki/uki.der
    chmod 400 /etc/pki/uki/uki.key
fi

# dracut signs every UKI it produces (only applies to --uefi builds)
( umask 077; cat > /etc/dracut.conf.d/95-uki-sign.conf << 'EOF'
uefi_secureboot_cert="/etc/pki/uki/uki.crt"
uefi_secureboot_key="/etc/pki/uki/uki.key"
EOF
)

# --- baked cmdline, captured from anaconda's BLS entries: dracut's
#     kernel_cmdline is the only source it bakes into a UKI (it never
#     reads /etc/kernel/cmdline); without it the UKI boots with none ---
opts=$(awk '/^options / {sub(/^options[ \t]+/,""); print; exit}' /boot/loader/entries/*.conf)
case "$opts" in
    *root=*) ;;
    *) echo "ERROR: could not derive kernel cmdline from BLS entries"; exit 1 ;;
esac
( umask 077; printf 'kernel_cmdline="%s"\n' "$opts" > /etc/dracut.conf.d/96-uki-cmdline.conf )

# --- switch kernel-install to the native UKI layout and mask the grub
#     plugins (grub2-common must stay installed: grub2-efi-x64 -> grub2-tools
#     -> grub2-common; masking is the supported override mechanism) ---
cat > /etc/kernel/install.conf << 'EOF'
layout=uki
uki_generator=dracut
EOF

# Generic UKI filenames on the plain ESP: kernel-install's default entry
# token is the machine-id, which systemd treats as confidential; "fedora"
# is uniform across installs, nothing to correlate.
printf 'fedora\n' > /etc/kernel/entry-token
for p in 20-grub.install 99-grub-mkconfig.install 95-set-boot-entry.install; do
    ln -sf /dev/null "/etc/kernel/install.d/$p"
done

# --- keep the chain current on every kernel install ---
cat > /etc/kernel/install.d/95-uki-chain-refresh.install << 'PLUGIN_EOF'
#!/usr/bin/bash
# Refresh shim copy (shim-x64 SBAT/security updates land in EFI/fedora)
# and re-sign sd-boot on every kernel install. Deliberately never fatal:
# must not break a kernel transaction; the previous binaries keep working.
COMMAND="${1:-}"
[ "$COMMAND" = "add" ] || exit 0
ESP=/boot/efi
[ -d "$ESP/EFI/uki" ] || exit 0
if [ -f "$ESP/EFI/fedora/shimx64.efi" ]; then
    cp -f "$ESP/EFI/fedora/shimx64.efi" "$ESP/EFI/uki/shimx64.efi" || true
    cp -f "$ESP/EFI/fedora/mmx64.efi"   "$ESP/EFI/uki/mmx64.efi" 2>/dev/null || true
fi
# a shim-x64 package update can restore its CSV (shim fallback would then
# recreate a GRUB-path boot entry); EFI/uki/BOOTX64.CSV stays the only one
rm -f "$ESP"/EFI/fedora/BOOT*.CSV
if sbsign --key /etc/pki/uki/uki.key --cert /etc/pki/uki/uki.crt \
        --output "$ESP/EFI/uki/grubx64.efi.tmp" \
        /usr/lib/systemd/boot/efi/systemd-bootx64.efi 2>/dev/null; then
    mv -f "$ESP/EFI/uki/grubx64.efi.tmp" "$ESP/EFI/uki/grubx64.efi"
else
    rm -f "$ESP/EFI/uki/grubx64.efi.tmp"
fi
exit 0
PLUGIN_EOF
chmod 755 /etc/kernel/install.d/95-uki-chain-refresh.install

# --- shim + signed systemd-boot in their own ESP dir ---
install -d "$ESP/EFI/uki" "$ESP/EFI/Linux" "$ESP/loader"
cp "$ESP/EFI/fedora/shimx64.efi" "$ESP/EFI/uki/shimx64.efi"
cp "$ESP/EFI/fedora/mmx64.efi"   "$ESP/EFI/uki/mmx64.efi"
sbsign --key /etc/pki/uki/uki.key --cert /etc/pki/uki/uki.crt \
    --output "$ESP/EFI/uki/grubx64.efi" \
    /usr/lib/systemd/boot/efi/systemd-bootx64.efi 2>/dev/null

# timeout 0: no menu, sd-boot loads the newest UKI. Holding a key during
# boot summons the menu, which keeps the previous kernel's UKI reachable
# for one boot. auto-entries/auto-firmware off: only signed UKIs listed.
cat > "$ESP/loader/loader.conf" << 'EOF'
timeout 0
editor no
auto-entries no
auto-firmware no
EOF

# --- build signed UKIs for every installed kernel (native flow) ---
for kdir in /lib/modules/*/; do
    kv=$(basename "$kdir")
    [ -f "$kdir/vmlinuz" ] || continue
    kernel-install add "$kv" "$kdir/vmlinuz"
done
ls "$ESP"/EFI/Linux/*.efi >/dev/null 2>&1 \
    || { echo "ERROR: no UKI was produced"; exit 1; }

# --- queue the MOK enrollment: mokutil exits on a missing SecureBoot
#     variable for every enrollment operation, so firmware without one
#     gets nothing queued; a variable exists even with Secure Boot off ---
sb_var=/sys/firmware/efi/efivars/SecureBoot-8be4df61-93ca-11d2-aa0d-00e098032b8c
if [ ! -e "$sb_var" ]; then
    echo "Firmware has no Secure Boot support: MOK enrollment skipped; shim loads the boot chain unverified."
else
    # MokManager's prompt counts down 10 s by default and boots on with
    # the request still queued; -1 makes it wait for a key. Persistent
    # firmware variable; mokutil --timeout 10 restores the default.
    mokutil --timeout -1 2>/dev/null \
        || echo "WARNING: could not set the MOK prompt timeout; the enrollment screen keeps its 10 s countdown."
    if [ -f /root/.mok-pw ]; then
        hashfile=$(mktemp)
        if mokutil --generate-hash="$(cat /root/.mok-pw)" > "$hashfile" 2>/dev/null \
                && mokutil --import /etc/pki/uki/uki.der --hash-file "$hashfile" 2>/dev/null; then
            echo "MOK enrollment queued; the enrollment screen should ask for the chosen password on the next boot."
        else
            echo "WARNING: could not queue MOK enrollment; the firstboot script will import it interactively."
        fi
        # keys of earlier installs named in %pre: same screen, same password
        if ls /root/.mok-del/*.der >/dev/null 2>&1; then
            if mokutil --delete /root/.mok-del/*.der --hash-file "$hashfile" 2>/dev/null; then
                echo "MOK deletion queued for $(ls /root/.mok-del/*.der | wc -l) key(s): the same screen offers Delete MOK."
            else
                echo "WARNING: could not queue the MOK deletion; delete stale keys later (see /root/uki-notes.txt)."
            fi
        fi
        shred -u "$hashfile" /root/.mok-pw 2>/dev/null || rm -f "$hashfile" /root/.mok-pw
        rm -rf /root/.mok-del
    fi
fi

# --- boot entries, matched by GPT partition UUID only: entries of the
#     partitions recorded before the wipe (earlier installs of THIS disk)
#     and of the new ESP (anaconda's grub entry); other disks untouched ---
src=$(findmnt -n -o SOURCE "$ESP" || true)
[ -n "$src" ] || { echo "ERROR: could not determine the ESP source device for $ESP"; exit 1; }
case "$src" in
    *nvme*p[0-9]*|*mmcblk*p[0-9]*) disk="${src%p*}"; part="${src##*p}" ;;
    *) disk="${src%%[0-9]*}"; part="${src##*[!0-9]}" ;;
esac

delete_entries_by_partuuid() {
    local puuid num
    puuid=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
    while :; do
        num=$(efibootmgr -v | awk -v p="$puuid" \
            'index(tolower($0), p) {sub(/^Boot/,""); sub(/\*?[[:space:]].*/,""); print; exit}' \
            || true)
        [ -n "$num" ] || break
        efibootmgr -B -b "$num" >/dev/null
    done
}

if [ -f /root/.old-partuuids ]; then
    while IFS= read -r pu; do
        if [ -n "$pu" ]; then delete_entries_by_partuuid "$pu"; fi
    done < /root/.old-partuuids
    rm -f /root/.old-partuuids
fi

new_puuid=$(blkid -s PARTUUID -o value "$src" || true)
[ -n "$new_puuid" ] || { echo "ERROR: could not read the partition UUID of $src"; exit 1; }
delete_entries_by_partuuid "$new_puuid"
efibootmgr --create --disk "$disk" --part "$part" \
    --label "@KS_BOOT_LABEL@" --loader '\EFI\uki\shimx64.efi' >/dev/null

# --- GRUB path: the package stays (shim-x64 hard-requires it); without
#     a boot entry, grub.cfg or kernel-install plugins it cannot boot, and
#     under Secure Boot shim verifies anything it could load anyway ---
rm -f "$ESP"/EFI/fedora/grub.cfg "$ESP"/EFI/fedora/grubenv
rm -rf /boot/grub2 /boot/loader
rm -f /boot/vmlinuz-* /boot/initramfs-*

# shim's fallback binary (EFI/BOOT) recreates NVRAM entries from the
# ESP's BOOT*.CSV files; the stock CSV would recreate the GRUB entry, so
# EFI/uki gets one for the UKI chain (UTF-16LE with BOM, shim's format)
rm -f "$ESP"/EFI/fedora/BOOT*.CSV
printf '\xff\xfe' > "$ESP/EFI/uki/BOOTX64.CSV"
printf '%s\n' 'shimx64.efi,@KS_BOOT_LABEL@,,Boot entry restored by shim fallback' \
    | iconv -f UTF-8 -t UTF-16LE >> "$ESP/EFI/uki/BOOTX64.CSV"

# --- firstboot fragment: verify/finish MOK enrollment ---
install -d -m 700 /etc/firstboot.d
cat > /etc/firstboot.d/500-uki-mok.sh << 'FRAG_EOF'
# mokutil exits on a missing SecureBoot variable for every enrollment
# operation, so without one the import loop below could never end, and
# this runs before any getty; a variable exists with Secure Boot off.
if [ ! -e /sys/firmware/efi/efivars/SecureBoot-8be4df61-93ca-11d2-aa0d-00e098032b8c ]; then
    echo "Firmware has no Secure Boot support: MOK enrollment skipped, shim loads the boot chain unverified."
    return 0
fi
# mokutil exits 1 for an enrolled key, and a pipe into grep -q can cut a
# long listing short: captured text decides, never a pipeline's status
mok_enrolled=""
case "$(mokutil --test-key /etc/pki/uki/uki.der 2>/dev/null || true)" in
    *"already enrolled"*) mok_enrolled=1 ;;
esac
if [ -n "$mok_enrolled" ]; then
    echo "UKI Secure Boot key: enrolled."
elif [ -n "$(mokutil --list-new 2>/dev/null)" ]; then
    echo "MOK enrollment still PENDING. shim's enrollment screen should appear"
    echo "on the next reboot; enroll with the password chosen during installation"
    echo "(typical menus: Enroll MOK -> Continue -> Yes)."
else
    echo "=== Enroll the UKI Secure Boot key (MOK) ==="
    echo "Choose a ONE-TIME password (8-16 chars); shim's enrollment screen"
    echo "should appear on the next reboot: enroll with that password"
    echo "(typical menus: Enroll MOK -> Continue -> Yes)."
    tries=0
    until mokutil --import /etc/pki/uki/uki.der; do
        tries=$((tries+1))
        [ "$tries" -lt 3 ] || { echo "WARNING: enrollment not queued after three attempts: /root/uki-notes.txt has the procedure."; break; }
    done
fi
FRAG_EOF
chmod 700 /etc/firstboot.d/500-uki-mok.sh

# --- on-machine cheat sheet ---
cat > /root/uki-notes.txt << 'EOF'
UKI-only boot chain: facts and recovery
- Chain: firmware -> shim (EFI/uki, MS-signed) -> sd-boot (signed with the
  machine key) -> UKI (EFI/Linux/*.efi). GRUB exists only as an inert
  package (shim hard-requires it): no boot entry, no grub.cfg, and under
  Secure Boot anything it could load is signature-checked via shim.
- First boot (Secure Boot on): shim's enrollment screen (MokManager)
  should appear; enroll with the password chosen during installation
  (typical menus: Enroll MOK -> Continue -> Yes; wording varies by shim
  version). Deleting the request instead leaves the machine unbootable
  until enrolled (see below).
- Verify anytime:   mokutil --test-key /etc/pki/uki/uki.der
- Enrollment screen: waits for a key (MokTimeout -1, set at install;
  mokutil --timeout 10 restores the 10 s countdown). An unanswered
  request stays queued and the screen returns on the next boot; with
  Secure Boot on the UKI does not load until the key is enrolled.
- Reinstalling: every install enrolls a fresh key; the installer lists
  this kickstart's enrolled keys by boot label, creation date and
  fingerprint and deletes the ones named on the same enrollment screen.
- Stale keys: every key ever enrolled stays in the firmware's small
  variable storage until deleted; too many and the firmware may not
  boot at all. Match keys to disks by boot label (the OU of the
  subject) and fingerprint:
    mokutil --list-enrolled      (the CN=Secure Boot Signing Key entries)
    openssl x509 -in /etc/pki/uki/uki.crt -noout -fingerprint -sha1
  export them (mokutil --export -> MOK-000N.der in the current dir) and
    mokutil --delete MOK-000N.der    (one-time password; next boot:
                                      Delete MOK on the same screen)
  for every key that belongs to no disk still in use.
- Boot menu: hidden; hold a key during boot to show it. After a kernel
  update it still offers the previous kernel's UKI for one boot;
  whichever kernel boots, the others are removed at that boot
  (single-kernel policy, prune-old-kernels.service). Recovery beyond
  that: live USB.
- Kernel cmdline: baked into the signed UKI from
  /etc/dracut.conf.d/96-uki-cmdline.conf (dracut's only cmdline source
  for UKIs). To change it: edit that file, then
  kernel-install add <kver> /lib/modules/<kver>/vmlinuz
- Updates: kernel-install layout=uki builds+signs a UKI per kernel
  automatically; EFI/uki shim/sd-boot copies refresh on kernel installs.
- Signing key: /etc/pki/uki (on the encrypted root).
- FULL RECOVERY from a live USB:
    cryptsetup open /dev/<rootpart> root && mount /dev/mapper/root /mnt
    mount /dev/<bootpart> /mnt/boot && mount /dev/<esppart> /mnt/boot/efi
    for d in dev proc sys run; do mount --bind /$d /mnt/$d; done
    mount --bind /sys/firmware/efi/efivars /mnt/sys/firmware/efi/efivars
    chroot /mnt
    kernel-install add <kver> /lib/modules/<kver>/vmlinuz   # rebuild UKI
    mokutil --import /etc/pki/uki/uki.der                   # re-queue MOK
EOF
chmod 600 /root/uki-notes.txt
if [ ! -e "$sb_var" ]; then
    echo "- THIS firmware has no Secure Boot support: the chain loads unverified," >> /root/uki-notes.txt
    echo "  and MOK enrollment (incl. the recovery re-queue above) is not possible." >> /root/uki-notes.txt
fi

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/500-uki-boot.sh << 'VERIFY_EOF'
# Follows the firmware's own state: 1 = enforcing, 0 = switched off,
# variable ABSENT = no Secure Boot implementation. Off and absent pass
# %pre on a typed YES: WARN on every run, never a FAIL.
sb_var=/sys/firmware/efi/efivars/SecureBoot-8be4df61-93ca-11d2-aa0d-00e098032b8c
if [ ! -e "$sb_var" ]; then
    echo "  WARN  firmware has no Secure Boot support: the signed boot chain loads unverified"
else
    if [ "$(od -An -tu1 -j4 -N1 "$sb_var" | tr -d ' ')" = "1" ]; then
        sh_chk "Secure Boot enabled"       "mokutil --sb-state | grep -qi enabled"
    else
        echo "  WARN  Secure Boot DISABLED in firmware: the signed boot chain loads unverified"
    fi
    # an enrolled key keeps the machine one firmware toggle away from a
    # chain the firmware checks
    sh_chk "MOK key enrolled"          "mokutil --test-key /etc/pki/uki/uki.der 2>&1 | grep -q 'already enrolled'"
    # Every enrolled key stays in the firmware's small variable storage.
    # Listed for comparison with the disks in use: one key
    # per disk installed by this kickstart, this system's own marked.
    own=$(openssl x509 -in /etc/pki/uki/uki.crt -noout -fingerprint -sha1 2>/dev/null | sed 's/.*=//' | tr 'A-F' 'a-f')
    mokutil --list-enrolled 2>/dev/null | awk -v own="$own" '
        function flush() { if (ours) { c++; printf "  INFO  machine key %s  %s  created %s  %s%s\n", n, lb, nb, fp, (fp == own ? "  (this system)" : "") } }
        /^\[key [0-9]+\]/ { flush(); n=$2; sub(/\]/,"",n); ours=0; lb=""; nb=""; fp="" }
        /SHA1 Fingerprint:/ { fp=$0; sub(/.*SHA1 Fingerprint: */,"",fp) }
        /Not Before:/ { nb=$0; sub(/.*Not Before: */,"",nb) }
        /Subject: CN=Secure Boot Signing Key(, OU=|$)/ { ours=1; lb=$0; if (!sub(/.*, OU=/,"",lb)) lb="-" }
        END { flush(); printf "  INFO  %d machine key(s) enrolled: one per disk installed by this kickstart is expected (leftovers: /root/uki-notes.txt)\n", c }'
fi
# the one-boot window closes before login (prune-old-kernels runs
# before the updater), so a second UKI here is a stale kernel
sh_chk "exactly one signed UKI on the ESP (single kernel)" "test \$(ls /boot/efi/EFI/Linux/*.efi 2>/dev/null | wc -l) -eq 1"
# matched by this ESP's partition UUID and the loader path: a label shared
# with another disk's entry proves nothing
esp=$(lsblk -no PARTUUID "$(findmnt -no SOURCE /boot/efi)")
sh_chk "UKI boot entry for this ESP"   "test -n '$esp' && efibootmgr -v | grep -i \"GPT,$esp\" | grep -qiF 'EFI\\uki\\shimx64.efi'"
sh_chk "no GRUB boot entry for this ESP" "! efibootmgr -v | grep -i \"GPT,$esp\" | grep -qiF 'EFI\\fedora\\shimx64.efi'"
sh_chk "GRUB neutralized (no grub.cfg)" "! test -f /boot/efi/EFI/fedora/grub.cfg"
sh_chk "fallback CSV routes to UKI chain" "test -f /boot/efi/EFI/uki/BOOTX64.CSV && ! test -e /boot/efi/EFI/fedora/BOOTX64.CSV"
sh_chk "UKI cmdline source has root="   "grep -q 'root=' /etc/dracut.conf.d/96-uki-cmdline.conf"
sh_chk "signing key: owner root, group at most read, others none" "stat -c '%U %a' /etc/pki/uki/uki.key | grep -qE '^root [0-7][04]0$'"
VERIFY_EOF
%end
