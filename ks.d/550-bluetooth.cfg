# 550-bluetooth: bluez with LE address privacy, pairable only in a session
# main.conf sets Privacy=device: resolvable private addresses on LE, while
#   classic BR/EDR carries the fixed address.
# Pairing happens inside a bluetoothctl session (agent on, scan on, pair,
#   trust, connect); discoverable mode is switched on by hand there and
#   ends after the default 180 s.
# The controller's firmware is a vendor subpackage named in build.conf.
# Bonds live in /var/lib/bluetooth; a copy restored by hand needs
#   restorecon -R and a bluetooth restart. An LE peripheral that refuses
#   to bond needs Privacy off. Without this module there is no stack.

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
bluez
%end

%post --erroronfail --log=/root/ks-post-550-bluetooth.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

mkdir -p /etc/bluetooth
cat > /etc/bluetooth/main.conf << 'EOF'
[General]
Privacy = device
EOF

systemctl enable bluetooth

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/550-bluetooth.sh << 'VERIFY_EOF'
sh_chk "bluetooth LE address privacy"  "grep -qx 'Privacy = device' /etc/bluetooth/main.conf"
# at rest: no pairing agent registered, discoverable never switched on
if ls /sys/class/bluetooth/hci* >/dev/null 2>&1; then
    sh_chk "bluetooth not discoverable/pairable" "bluetoothctl show | grep -cE '^[[:space:]]*(Discoverable|Pairable): no\$' | grep -qx 2"
fi
VERIFY_EOF
%end
