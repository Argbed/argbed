# 700-skel-shell: bash prompt and ls aliases for every future user
# Modules from 700 to 899 write user configuration into /etc/skel;
#   useradd copies it with permissions preserved.

%post --erroronfail --log=/root/ks-post-700-skel-shell.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

cat >> /etc/skel/.bashrc << 'EOF'

PS1='\[\033[0;93m\]\W \$ \[\033[0m\]\[\033]0;${PWD/#$HOME/\~}\007\]'

alias ls='command ls --color=auto'
alias la='command ls -la --color=auto'
alias ll='command ls -l --color=auto'
alias lh='command ls -hAl --color=auto'
alias l='command ls -l --color=auto'
EOF

chmod 600 /etc/skel/.bashrc /etc/skel/.bash_profile
%end
