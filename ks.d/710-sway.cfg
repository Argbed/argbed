# 710-sway: sway desktop with swaylock, swayidle, waybar and foot
# Writes the sway, foot and waybar configuration into /etc/skel.
# mesa-dri-drivers and polkit are explicit: without mesa sway renders in
#   software, without polkit logind denies the power keys.

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
sway
swaylock
# lock on idle and BEFORE suspend: without this, closing the lid and
# reopening it hands anyone an unlocked session
swayidle
waybar
foot
foot-terminfo
jetbrains-mono-fonts
google-noto-color-emoji-fonts
brightnessctl
mesa-dri-drivers
polkit
# Guard: no X11 compatibility layer, even if a dependency suggests it
# (xwayland is also disabled in the sway config below).
-xorg-x11-server-Xwayland
%end

%post --erroronfail --log=/root/ks-post-710-sway.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

SKEL=/etc/skel
install -d -m 700 "$SKEL/.config" "$SKEL/.config/systemd" "$SKEL/.config/systemd/user"

cat > "$SKEL/.config/systemd/user/sway-session.target" << 'EOF'
[Unit]
Description=sway compositor session
Documentation=man:systemd.special(7)
BindsTo=graphical-session.target
Wants=graphical-session-pre.target
After=graphical-session-pre.target
EOF
chmod 600 "$SKEL/.config/systemd/user/sway-session.target"

# SWAY CONFIG (MINIMAL)
install -d -m 700 "$SKEL/.config/sway"
cat > "$SKEL/.config/sway/config" << 'EOF'
# Initialize environment
exec /usr/bin/systemctl --user set-environment XDG_CURRENT_DESKTOP=sway
exec /usr/bin/systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec /usr/bin/systemctl --user start sway-session.target

# Disable
xwayland disable
#output eDP-1 disable
for_window [app_id=".*"] floating disable

# --- Mod key ---
set $mod Mod4

# --- Terminal ---
set $term foot

# --- Font ---
font pango:JetBrains Mono 11

# --------------------------
# Startup
# --------------------------
exec_always waybar

# Auto-lock: 10 min idle, and always before suspend (lid close).
# -u: no unlock indicator (the ring that lights up on every keystroke).
exec swayidle -w \
    timeout 600 'swaylock -f -c 000000 -u' \
    before-sleep 'swaylock -f -c 000000 -u'

# --------------------------
# Input
# --------------------------
input * {
    repeat_delay 300
    repeat_rate 30
}

input type:touchpad {
    tap enabled
}

focus_follows_mouse no
mouse_warping none

# --------------------------
# Window appearance
# --------------------------

# Spacing
gaps inner 8
gaps outer 0

# Borders
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders both

# Colors
client.focused          #5e81ac #1d1f21 #ffffff #5e81ac #5e81ac
client.focused_inactive #3b4252 #1d1f21 #d8dee9 #3b4252 #3b4252
client.unfocused        #1c1f24 #1d1f21 #888888 #1c1f24 #1c1f24
client.urgent           #bf616a #1d1f21 #ffffff #bf616a #bf616a

# --------------------------
# Keybindings
# --------------------------

# Laptop multimedia keys for volume and LCD brightness
bindsym XF86AudioRaiseVolume exec wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
#bindsym XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym XF86MonBrightnessUp exec brightnessctl -e4 -n2 set 5%+
bindsym XF86MonBrightnessDown exec brightnessctl -e4 -n2 set 5%-

# Launch apps
bindsym $mod+Return exec $term
bindsym $mod+f exec firefox --private-window

# sway
#bindsym $mod+Shift+e exec swaymsg exit
bindsym $mod+Shift+l exec swaylock -f -c 000000 -u

# System power
bindsym $mod+Shift+p exec systemctl poweroff
bindsym $mod+Shift+r exec systemctl reboot

# Kill window
bindsym $mod+Shift+q kill

# Split Workspace
bindsym $mod+v split v
bindsym $mod+h split h

# Focus movement
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Workspace switching
bindsym $mod+1 workspace 1
bindsym $mod+2 workspace 2
bindsym $mod+3 workspace 3
bindsym $mod+4 workspace 4
bindsym $mod+5 workspace 5
bindsym $mod+6 workspace 6
bindsym $mod+7 workspace 7
bindsym $mod+8 workspace 8
bindsym $mod+9 workspace 9
bindsym $mod+0 workspace 10

# Move container
bindsym $mod+Shift+1 move container to workspace 1
bindsym $mod+Shift+2 move container to workspace 2
bindsym $mod+Shift+3 move container to workspace 3
bindsym $mod+Shift+4 move container to workspace 4
bindsym $mod+Shift+5 move container to workspace 5
bindsym $mod+Shift+6 move container to workspace 6
bindsym $mod+Shift+7 move container to workspace 7
bindsym $mod+Shift+8 move container to workspace 8
bindsym $mod+Shift+9 move container to workspace 9
bindsym $mod+Shift+0 move container to workspace 10

# Floating control
floating_modifier $mod normal
EOF
chmod 600 "$SKEL/.config/sway/config"

# "JetBrains Mono" is the fontconfig family name
install -d -m 700 "$SKEL/.config/foot"
cat > "$SKEL/.config/foot/foot.ini" << 'EOF'
[main]
font=JetBrains Mono:size=15,Noto Color Emoji:size=15

[security]
# Terminal programs may COPY to the clipboard (OSC52 yank) but never READ
# it: they have no other clipboard path, so this closes their sniffing
# channel; ctrl+shift+v pastes into the terminal (foot does the paste).
osc52=copy-enabled
EOF
chmod 600 "$SKEL/.config/foot/foot.ini"

# Waybar Config
install -d -m 700 "$SKEL/.config/waybar"
cat > "$SKEL/.config/waybar/config" << 'EOF'
{
  "layer": "top",
  "position": "top",

  "modules-left": [
    "sway/workspaces",
    "sway/window"
  ],

  "modules-center": [
    "clock"
  ],

  "modules-right": [
    "network",
    "cpu",
    "memory",
    "pulseaudio"
  ],

  /* --- Workspaces (dynamic) --- */
  "sway/workspaces": {
    "format": "{name}"
  },

  /* --- Window title --- */
  "sway/window": {
    "format": "{}",
    "max-length": 120
  },

  /* --- Clock --- */
  "clock": {
    "format": "{:%a %b %d  %I:%M:%S %p}",
    "interval": 1,

    "tooltip": true,
    "tooltip-format": "<big>{:%B %Y}</big>\n<tt>{calendar}</tt>"
  },

  /* --- Network --- */
  "network": {
    "interval": 1,
    "format": "↓ {bandwidthDownBytes} ↑ {bandwidthUpBytes}",
    "format-disconnected": "offline",

    "tooltip": true,
    "tooltip-format": "{ifname}\n{ipaddr}\n{essid}"
  },

  /* --- CPU --- */
  "cpu": {
    "interval": 1,
    "format": "🧠 {usage}%",
    "states": {
      "warning": 60,
      "critical": 85
    },
    "tooltip": true
  },

  /* --- Memory --- */
  "memory": {
    "interval": 1,
    "format": "💾 {used:0.1f}G",
    "states": {
      "warning": 70,
      "critical": 90
    },
    "tooltip": true
  },

  /* --- Audio --- */
  "pulseaudio": {
    "format": "{icon} {volume}%",
    "format-muted": "🔇",
    "format-icons": ["🔈", "🔉", "🔊"],
    "tooltip": true
  }
}
EOF
chmod 600 "$SKEL/.config/waybar/config"

cat > "$SKEL/.config/waybar/style.css" << 'EOF'
* {
  font-family: "JetBrains Mono", "Noto Color Emoji";
  font-size: 15px;
  font-weight: 500;
  min-height: 0;
  transition: color 120ms ease;
}

window#waybar {
  background: rgba(12, 14, 18, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  color: rgba(235, 240, 255, 0.92);
  margin: 6px;
}

/* Workspaces */
#workspaces {
  padding: 2px 6px;
  margin: 4px 6px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.04);
}

#workspaces button {
  padding: 0 7px;
  margin: 2px;
  border-radius: 8px;
  color: rgba(200, 210, 230, 0.65);
  background: transparent;
}

#workspaces button.focused {
  color: rgba(255, 255, 255, 0.95);
  background: rgba(120, 160, 255, 0.22);
}

#workspaces button.urgent {
  color: rgba(255, 255, 255, 0.95);
  background: rgba(255, 90, 90, 0.22);
}

/* Window */
#window {
  padding: 0 12px;
  margin: 4px 6px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
  color: rgba(240, 245, 255, 0.95);
  font-weight: 600;
}

/* Clock */
#clock {
  padding: 0 12px;
  margin: 4px 6px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.04);
  color: rgba(240, 245, 255, 0.95);
}

/* System modules */
#network, #cpu, #memory, #pulseaudio {
  padding: 0 10px;
  margin: 4px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
  color: rgba(220, 225, 240, 0.75);
}

/* State colors */

/* Offline / muted: warm amber */
#network.disconnected,
#pulseaudio.muted {
  color: #f2c572;
  font-weight: 500;
}

/* CPU alert colors */
#cpu.warning {
  color: #e6c27a;
}

#cpu.critical {
  color: #e58585;
  font-weight: 600;
}

/* Memory alert colors */
#memory.warning {
  color: #e6c27a;
}

#memory.critical {
  color: #e58585;
  font-weight: 600;
}
EOF
chmod 600 "$SKEL/.config/waybar/style.css"

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/710-sway.sh << 'VERIFY_EOF'
# swayidle, swaylock before sleep and the user power keybindings all hang
# off the logind session pam_systemd registers at login
sh_chk "logind sessions (pam_systemd)"     "loginctl list-sessions --no-legend | grep -q ."
VERIFY_EOF
%end
