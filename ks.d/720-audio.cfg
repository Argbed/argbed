# 720-audio: pipewire stack with no capture nodes
# WirePlumber never creates capture nodes: ALSA and Bluetooth
#   microphones and libcamera cameras have no pipewire node; playback is
#   untouched.
# alsa-ucm is explicit: many devices need the use-case profiles. The SOF
#   DSP firmware is a vendor subpackage named in build.conf.

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
pipewire
pipewire-pulse
wireplumber
alsa-ucm
%end

%post --erroronfail --log=/root/ks-post-720-audio.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

mkdir -p /etc/wireplumber/wireplumber.conf.d
cat > /etc/wireplumber/wireplumber.conf.d/99-disable-capture.conf << 'EOF'
# Capture devices never become pipewire nodes: no pipewire client sees a
# microphone or camera stream, whatever the user or mute state. Moving
# this file away and restarting wireplumber re-enables them.

monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.*" } ]
    actions = { update-props = { node.disabled = true } }
  }
]

monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = { update-props = { node.disabled = true } }
  }
]

# MIPI webcams bypass uvcvideo (blacklisted in 430-hardening) and
# would surface via libcamera, so that path is closed too.
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "~libcamera.*" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
EOF
chmod 644 /etc/wireplumber/wireplumber.conf.d/99-disable-capture.conf

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/720-audio.sh << 'VERIFY_EOF'
sh_chk "capture disabled in pipewire"      "test -f /etc/wireplumber/wireplumber.conf.d/99-disable-capture.conf"
VERIFY_EOF
%end
