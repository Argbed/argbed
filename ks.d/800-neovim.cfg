# 800-neovim: neovim as the only editor, hardened per-user config in skel
# The init.lua has no modelines, exrc, shell, providers, netrw, backups,
#   swap or shada; undo and views live in XDG_RUNTIME_DIR only, for
#   writable regular files; the clipboard goes through OSC 52, which foot
#   allows for copy only, so the paste maps are inert there.

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
neovim
%end

%post --erroronfail --log=/root/ks-post-800-neovim.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

# /usr/local/bin, not /usr/bin: rpm owns the paths there.
ln -sfn /usr/bin/nvim /usr/local/bin/vim

# No vi/vim-minimal on this system: point visudo and $EDITOR at nvim
# (visudo's compiled-in fallback is /usr/bin/vi, which does not exist here).
echo 'Defaults editor=/usr/bin/nvim' > /etc/sudoers.d/editor
chmod 440 /etc/sudoers.d/editor
echo 'export EDITOR=nvim' > /etc/profile.d/editor.sh
chmod 644 /etc/profile.d/editor.sh

SKEL=/etc/skel
install -d -m 700 "$SKEL/.config" "$SKEL/.config/nvim"
cat > "$SKEL/.config/nvim/init.lua" << 'EOF'
-- No modelines or exrc, providers and netrw off, OSC 52 clipboard, undo
-- and views in RAM for allowlisted files only, no ShaDa.

local opt = vim.opt
local g   = vim.g

-----------------------------------------------------------------------
-- 1) Reduce execution / injection surfaces
-----------------------------------------------------------------------

opt.modeline  = false
opt.modelines = 0

opt.exrc   = false
opt.secure = true

-- Disable netrw to reduce surface.
g.loaded_netrw       = 1
g.loaded_netrwPlugin = 1

-- Disable unneeded language providers (reduce surface).
g.loaded_perl_provider    = 0
g.loaded_ruby_provider    = 0
g.loaded_node_provider    = 0
g.loaded_python3_provider = 0

-----------------------------------------------------------------------
-- 2) Safer file I/O defaults
-----------------------------------------------------------------------

opt.shell = "/bin/false"
opt.backup      = false
opt.writebackup = false
opt.swapfile    = false

-----------------------------------------------------------------------
-- 3) ShaDa off: no disk state
-----------------------------------------------------------------------

opt.shadafile = "NONE"

-----------------------------------------------------------------------
-- 4) Minimal usability
-----------------------------------------------------------------------

opt.number         = true
opt.relativenumber = false
opt.signcolumn     = "yes"
opt.cursorline     = true
opt.wrap           = false
opt.scrolloff      = 6
opt.sidescrolloff  = 6
opt.termguicolors  = true

opt.expandtab      = true
opt.shiftwidth     = 4
opt.tabstop        = 4
opt.smartindent    = true

opt.ignorecase     = true
opt.smartcase      = true
opt.hlsearch       = false
opt.incsearch      = true

opt.timeoutlen     = 400
opt.updatetime     = 300

-----------------------------------------------------------------------
-- 5) Clipboard (explicit only, via OSC 52)
-----------------------------------------------------------------------

opt.clipboard = ""

-- Route explicit "+ / "* register operations through OSC 52 so the
-- terminal (foot) mediates copy/paste; nvim needs no wl-clipboard binary
-- and no direct Wayland socket access.
do
  local osc52 = require("vim.ui.clipboard.osc52")
  g.clipboard = {
    name  = "OSC 52",
    copy  = { ["+"] = osc52.copy("+"), ["*"] = osc52.copy("*") },
    paste = { ["+"] = osc52.paste("+"), ["*"] = osc52.paste("*") },
  }
end

g.mapleader = " "
local map    = vim.keymap.set
local silent = { noremap = true, silent = true }

map("n", "<leader>w", "<cmd>write<CR>", silent)
map("n", "<leader>q", "<cmd>quit<CR>",  silent)
map("n", "<leader>h", "<cmd>nohlsearch<CR>", silent)
map("n", "<leader>p", "<cmd>set paste!<CR>", silent)

map({ "n", "v" }, "<leader>y", '"+y',  silent)
map("n", "<leader>Y", '"+yy',         silent)
map("n", "<leader>P", '"+P',          silent)
map("n", "<leader>V", '"+p',          silent)

map("n", "<leader>xc", function()
  vim.fn.setreg("+", "")
  vim.fn.setreg("*", "")
  vim.notify("Cleared + and * registers (system clipboard manager may still retain history)", vim.log.levels.INFO)
end, silent)

-----------------------------------------------------------------------
-- 6) Autocmds: minimal & safe
-----------------------------------------------------------------------

vim.api.nvim_create_autocmd("TextYankPost", {
  callback = function()
    vim.highlight.on_yank({ timeout = 120 })
  end,
})

-----------------------------------------------------------------------
-- 7) Strict allowlist helpers (shared by undo + views)
-----------------------------------------------------------------------

local function runtime_subdir(rel)
  -- os.getenv, not vim.fn.getenv: the latter returns vim.NIL (truthy
  -- userdata) for unset variables, which passes this guard and crashes
  -- the concatenation below. Unset happens under sudo (env_reset).
  local rtd = os.getenv("XDG_RUNTIME_DIR")
  if not rtd or rtd == "" then return nil end

  local base = rtd .. "/nvim"
  local dir  = base .. "/" .. rel

  vim.fn.mkdir(dir, "p")
  local lst = vim.loop.fs_lstat(dir)
  if not lst or lst.type ~= "directory" then return nil end

  -- Best-effort: enforce private perms (0700).
  pcall(vim.loop.fs_chmod, dir, 448)
  return dir
end

local function allow_file(bufnr)
  -- Only normal file buffers
  if vim.bo[bufnr].buftype ~= "" then return false end

  local name = vim.api.nvim_buf_get_name(bufnr)
  if not name or name == "" then return false end

  -- Reject symlinks
  local lst = vim.loop.fs_lstat(name)
  if lst and lst.type == "link" then return false end

  -- Regular file exists?
  local st = vim.loop.fs_stat(name)
  if st then
    if st.type ~= "file" then return false end
    -- only if writable by the user
    if vim.fn.filewritable(name) ~= 1 then return false end
    return true
  end

  -- a file not yet created: allow only if the parent directory is writable
  local parent = vim.fn.fnamemodify(name, ":h")
  if not parent or parent == "" then return false end
  if vim.fn.filewritable(parent) ~= 2 then return false end

  return true
end

-----------------------------------------------------------------------
-- 8) Persistent undo: RAM-only AND only for allowlisted buffers
-----------------------------------------------------------------------

do
  local undodir = runtime_subdir("undo")
  if not undodir then
    -- Fail closed: no disk fallback
    opt.undofile = false
  else
    opt.undodir = undodir .. "//"
    opt.undofile = false -- default OFF; enabled only when allowlist passes
  end

  local aug = vim.api.nvim_create_augroup("StrictUndo", { clear = true })

  -- Toggle undofile ON only for allowlisted buffers; OFF otherwise.
  vim.api.nvim_create_autocmd({ "BufEnter", "BufWinEnter" }, {
    group = aug,
    callback = function(args)
      if not undodir then
        opt.undofile = false
        return
      end
      opt.undofile = allow_file(args.buf)
    end,
  })
end

-----------------------------------------------------------------------
-- 9) RAM-only views: strict allowlist mkview/loadview for cursor restore
-----------------------------------------------------------------------

do
  local viewdir = runtime_subdir("views")
  if not viewdir then
    return
  end

  opt.viewdir = viewdir
  opt.viewoptions = { "cursor" } -- minimal; "folds" is the other candidate

  local aug = vim.api.nvim_create_augroup("RamViewsStrict", { clear = true })

  vim.api.nvim_create_autocmd("BufWinEnter", {
    group = aug,
    callback = function(args)
      if not allow_file(args.buf) then return end
      pcall(vim.cmd, "silent! loadview")
    end,
  })

  vim.api.nvim_create_autocmd("BufWinLeave", {
    group = aug,
    callback = function(args)
      if not allow_file(args.buf) then return end
      pcall(vim.cmd, "silent! mkview")
    end,
  })
end
EOF
chmod 600 "$SKEL/.config/nvim/init.lua"

# sudo resets HOME to /root (always_set_home in the stock sudoers), so
# sudo nvim and visudo never see a skel-copied config: root gets its own.
install -d -m 700 /root/.config /root/.config/nvim
install -m 600 "$SKEL/.config/nvim/init.lua" /root/.config/nvim/init.lua
%end
