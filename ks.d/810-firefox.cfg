# 810-firefox: Firefox hardened by enterprise policy and autoconfig
# Installs firefox, default-fonts-core-sans and uBlock Origin from Fedora's
#   package: medium mode by policy, padlocked rules last until next start.
# Off: telemetry, studies, crash reports, Pocket, accounts, sync, password
#   manager, autofill, AI features, suggestions, sponsored content, region
#   lookup, plugin and system add-on update checks, prefetch, push,
#   geolocation, WebRTC host candidates, Do Not Track, DRM (its CDM would
#   come from Google); JIT and WebAssembly off as changeable defaults.
# On: HTTPS-only, TLS 1.2 floor, tracking protection, Global Privacy
#   Control, third-party cookies rejected, download location asked, GTK
#   picker; privacy prefs locked, DNS over HTTPS off but unlocked. What
#   still leaves: Mozilla remote settings, Safe Browsing, uBlock's lists.

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
firefox
default-fonts-core-sans
mozilla-ublock-origin
# mozilla-openh264 supplies H.264 (the gdk-pixbuf loader chain pulls in
# openh264); other ffmpeg-decoded formats need the system libavcodec:
#ffmpeg-free
%end

%post --erroronfail --log=/root/ks-post-810-firefox.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

install -d /usr/lib64/firefox/distribution
cat > /usr/lib64/firefox/distribution/policies.json << 'EOF'
{
  "policies": {
    "DisableTelemetry": true,
    "DisableFirefoxStudies": true,
    "DisablePocket": true,
    "DisableFeedbackCommands": true,
    "DisableFirefoxAccounts": true,
    "DisableProfileImport": true,
    "DisableFormHistory": true,
    "DisableSetDesktopBackground": true,
    "DontCheckDefaultBrowser": true,
    "DisableRemoteImprovements": true,
    "NoDefaultBookmarks": true,
    "DisplayBookmarksToolbar": "never",
    "OverrideFirstRunPage": "",
    "OverridePostUpdatePage": "",
    "Homepage": {
      "URL": "about:blank",
      "StartPage": "none",
      "Locked": false
    },
    "NewTabPage": false,
    "ShowHomeButton": false,
    "NetworkPrediction": false,
    "CaptivePortal": false,
    "SearchSuggestEnabled": false,
    "SearchEngines": {
      "Default": "DuckDuckGo",
      "Remove": ["Google", "Bing", "Amazon.com", "eBay", "Perplexity"],
      "PreventInstalls": true
    },
    "FirefoxSuggest": {
      "WebSuggestions": false,
      "SponsoredSuggestions": false,
      "ImproveSuggest": false,
      "Locked": true
    },
    "UserMessaging": {
      "WhatsNew": false,
      "ExtensionRecommendations": false,
      "FeatureRecommendations": false,
      "UrlbarInterventions": false,
      "SkipOnboarding": true,
      "MoreFromMozilla": false,
      "FirefoxLabs": false,
      "Locked": true
    },
    "PasswordManagerEnabled": false,
    "AutofillAddressEnabled": false,
    "AutofillCreditCardEnabled": false,
    "PromptForDownloadLocation": true,
    "AIControls": {
      "Default": { "Value": "blocked", "Locked": true }
    },
    "EncryptedMediaExtensions": {
      "Enabled": false,
      "Locked": true
    },
    "FirefoxHome": {
      "Weather": false,
      "SponsoredTopSites": false,
      "Stories": false,
      "SponsoredStories": false,
      "Locked": true
    },
    "EnableTrackingProtection": {
      "Value": true,
      "Locked": true,
      "Cryptomining": true,
      "Fingerprinting": true,
      "EmailTracking": true
    },
    "HttpsOnlyMode": "enabled",
    "SSLVersionMin": "tls1.2",
    "Cookies": {
      "Behavior": "reject-foreign",
      "BehaviorPrivateBrowsing": "reject-foreign",
      "Locked": true
    },
    "DNSOverHTTPS": {
      "Enabled": false,
      "Locked": false
    },
    "Permissions": {
      "Camera": { "BlockNewRequests": true, "Locked": true },
      "Microphone": { "BlockNewRequests": true, "Locked": true },
      "Location": { "BlockNewRequests": true, "Locked": true },
      "Notifications": { "BlockNewRequests": true, "Locked": true },
      "VirtualReality": { "BlockNewRequests": true, "Locked": true },
      "Autoplay": { "Default": "block-audio-video", "Locked": false }
    },
    "ExtensionSettings": {
      "uBlock0@raymondhill.net": {
        "installation_mode": "force_installed",
        "private_browsing": true,
        "default_area": "navbar",
        "updates_disabled": true
      }
    },
    "3rdparty": {
      "Extensions": {
        "uBlock0@raymondhill.net": {
          "userSettings": [
            ["advancedUserEnabled", "true"],
            ["prefetchingDisabled", "true"],
            ["hyperlinkAuditingDisabled", "true"],
            ["webrtcIPAddressHidden", "true"],
            ["cloudStorageEnabled", "false"],
            ["suspendUntilListsAreLoaded", "true"]
          ],
          "toOverwrite": {
            "filterLists": [
              "ublock-filters", "ublock-badware", "ublock-privacy",
              "ublock-unbreak", "ublock-quick-fixes",
              "easylist", "easyprivacy", "adguard-spyware-url", "block-lan",
              "urlhaus-1", "curben-phishing", "plowe-0"
            ]
          },
          "adminSettings": {
            "dynamicFilteringString": "behind-the-scene * * noop\nbehind-the-scene * image noop\nbehind-the-scene * 3p noop\nbehind-the-scene * inline-script noop\nbehind-the-scene * 1p-script noop\nbehind-the-scene * 3p-script noop\nbehind-the-scene * 3p-frame noop\n* * 3p-script block\n* * 3p-frame block",
            "hostnameSwitchesString": "no-large-media: behind-the-scene false\nno-csp-reports: * true"
          }
        }
      }
    }
  }
}
EOF
chmod 644 /usr/lib64/firefox/distribution/policies.json

# Prefs the policy engine cannot set go through autoconfig: local-settings.js
# names mozilla.cfg, which runs in the pref-only sandbox after every
# default-pref file, so it overrides Fedora's; lockPref fixes a value.
cat > /usr/lib64/firefox/defaults/pref/local-settings.js << 'EOF'
pref("general.config.filename", "mozilla.cfg");
pref("general.config.obscure_value", 0);
EOF
chmod 644 /usr/lib64/firefox/defaults/pref/local-settings.js

cat > /usr/lib64/firefox/mozilla.cfg << 'EOF'
// Firefox autoconfig: lockPref = fixed, defaultPref = a profile may
// change it. Policies live in distribution/policies.json (about:policies).
lockPref("app.normandy.enabled", false);
lockPref("app.normandy.api_url", "");
lockPref("browser.tabs.crashReporting.sendReport", false);
lockPref("browser.crashReports.unsubmittedCheck.autoSubmit2", false);
lockPref("browser.discovery.enabled", false);
lockPref("browser.urlbar.suggest.trending", false);
lockPref("browser.ml.enable", false);
lockPref("browser.ml.chat.enabled", false);
lockPref("browser.safebrowsing.downloads.remote.enabled", false);
lockPref("browser.download.always_ask_before_handling_new_types", true);
lockPref("browser.gnome-search-provider.enabled", false);
lockPref("network.connectivity-service.enabled", false);
lockPref("dom.push.enabled", false);
lockPref("dom.vr.enabled", false);
lockPref("geo.enabled", false);
lockPref("media.setsinkid.enabled", false);
lockPref("permissions.default.local-network", 2);
lockPref("permissions.default.localhost", 2);
lockPref("permissions.default.loopback-network", 2);
lockPref("privacy.fingerprintingProtection", true);
lockPref("privacy.globalprivacycontrol.enabled", true);
lockPref("privacy.donottrackheader.enabled", false);
lockPref("media.peerconnection.ice.default_address_only", true);
lockPref("media.peerconnection.ice.no_host", true);
lockPref("datareporting.usage.uploadEnabled", false);
lockPref("extensions.quarantineIgnoredByUser.uBlock0@raymondhill.net", true);
lockPref("widget.use-xdg-desktop-portal.file-picker", 0);
lockPref("browser.region.network.url", "");
lockPref("browser.region.update.enabled", false);
lockPref("media.gmp-manager.updateEnabled", false);
lockPref("extensions.systemAddon.update.enabled", false);
lockPref("extensions.getAddons.cache.enabled", false);
lockPref("browser.urlbar.quicksuggest.enabled", false);
lockPref("browser.urlbar.merino.endpointURL", "");
lockPref("browser.newtabpage.activity-stream.discoverystream.enabled", false);
defaultPref("browser.startup.homepage", "about:blank");
defaultPref("browser.newtabpage.pinned", "[]");
defaultPref("network.http.referer.XOriginTrimmingPolicy", 2);
defaultPref("javascript.options.ion", false);
defaultPref("javascript.options.baselinejit", false);
defaultPref("javascript.options.native_regexp", false);
defaultPref("javascript.options.wasm", false);
defaultPref("javascript.options.wasm_baselinejit", false);
defaultPref("media.videocontrols.picture-in-picture.enabled", false);
defaultPref("media.videocontrols.picture-in-picture.video-toggle.enabled", false);
defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
defaultPref("layout.css.prefers-color-scheme.content-override", 0);
EOF
chmod 644 /usr/lib64/firefox/mozilla.cfg

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/810-firefox.sh << 'VERIFY_EOF'
sh_chk "firefox policies + autoconfig"  "test -f /usr/lib64/firefox/distribution/policies.json && test -f /usr/lib64/firefox/mozilla.cfg && test -f /usr/lib64/firefox/defaults/pref/local-settings.js"
VERIFY_EOF
%end
