# 900-users: creates the admin (wheel) and desktop accounts
# Runs after every skel module; useradd copies the finished /etc/skel.
# Passwords stay locked until the first boot sets them, so no account is
#   ever passwordless. Only the desktop user autostarts sway on tty1.

%post --erroronfail --log=/root/ks-post-900-users.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

useradd -m -G wheel @KS_ADMIN_USER@
useradd -m @KS_DESKTOP_USER@

cat >> /home/@KS_DESKTOP_USER@/.bash_profile << 'EOF'

if [ -z "$WAYLAND_DISPLAY" ] && [ "$(tty)" = "/dev/tty1" ]; then
    exec sway
fi
EOF
%end
