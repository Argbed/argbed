# 910-confined-users: SELinux confined logins, mapped on the first boot
# The firstboot fragment maps the desktop user to user_u, the admin to
#   staff_u and __default__ to user_u, and writes /etc/sudoers.d/selinux-role
#   so wheel sudo transitions to sysadm_t, in the same step.
# bwrap-user.cil grants user_t the capabilities inside its own namespaces,
#   the netlink route writes and the mounts bubblewrap needs, so GTK's
#   sandboxed image loaders (any file dialog) work for the desktop user.
# A sway session under user_u may still hit AVC denials:
#   sudo ausearch -m avc -ts recent. Rollback: README, "Confined users".

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
# provides semanage
policycoreutils-python-utils
%end

%post --erroronfail --log=/root/ks-post-910-confined-users.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

install -d -m 700 /etc/firstboot.d
cat > /etc/firstboot.d/910-confined.sh << 'FRAG_EOF'
echo "=== Mapping users to confined SELinux users ==="
if ! semanage login -l 2>/dev/null | awk -v u="@KS_DESKTOP_USER@" '$1==u{f=1} END{exit !f}'; then
    semanage login -a -s user_u "@KS_DESKTOP_USER@"
fi
if ! semanage login -l 2>/dev/null | awk -v u="@KS_ADMIN_USER@" '$1==u{f=1} END{exit !f}'; then
    semanage login -a -s staff_u "@KS_ADMIN_USER@"
fi
restorecon -RF "/home/@KS_DESKTOP_USER@" "/home/@KS_ADMIN_USER@" || true

# an account added later is confined until the admin maps it otherwise
semanage login -m -s user_u -r s0 __default__

# wheel sudo must transition staff_t -> sysadm_t or admin commands fail.
# Written here, atomically with the mappings: this line must never exist
# while the admin is still unconfined, and vice versa.
cat > /etc/sudoers.d/selinux-role << 'SUDO_EOF'
%wheel ALL=(ALL) ROLE=sysadm_r TYPE=sysadm_t ALL
SUDO_EOF
chmod 440 /etc/sudoers.d/selinux-role
echo "Confined users active (desktop: user_u, admin: staff_u + sysadm sudo)."
FRAG_EOF
chmod 700 /etc/firstboot.d/910-confined.sh

# installed without a policy reload: the built policy loads on the first boot
cat > /etc/selinux/bwrap-user.cil << 'EOF'
(allow user_t self (cap_userns (dac_override net_admin setpcap)))
(allow user_t self (netlink_route_socket (nlmsg_write)))
(allow user_t devpts_t (filesystem (mount)))
(allow user_t proc_t (filesystem (mount)))
(allow user_t tmpfs_t (filesystem (mount unmount)))
(allow user_t fs_t (filesystem (remount unmount)))
(allow user_t root_t (dir (mounton)))
(allow user_t tmp_t (dir (mounton)))
(allow user_t user_tmp_t (file (mounton)))
(allow user_t fonts_cache_t (dir (mounton)))
EOF
chmod 644 /etc/selinux/bwrap-user.cil
semodule -n -i /etc/selinux/bwrap-user.cil

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/910-confined-users.sh << 'VERIFY_EOF'
sh_chk "@KS_DESKTOP_USER@ -> user_u"   "semanage login -l | awk '\$1==\"@KS_DESKTOP_USER@\" && \$2==\"user_u\"' | grep -q ."
sh_chk "@KS_ADMIN_USER@ -> staff_u"    "semanage login -l | awk '\$1==\"@KS_ADMIN_USER@\" && \$2==\"staff_u\"' | grep -q ."
sh_chk "__default__ -> user_u"          "semanage login -l | awk '\$1==\"__default__\" && \$2==\"user_u\"' | grep -q ."
sh_chk "bwrap sandbox policy module (user_t)" "semodule -l | grep -qx bwrap-user"
VERIFY_EOF
%end
