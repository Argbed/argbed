# 980-firstboot: passwords and static DNS on the first boot, then reboot
# firstboot.service runs on tty1 before getty and the boot updater:
#   writes resolv.conf, sets both users' passwords, sources the
#   fragments in /etc/firstboot.d in order, then shreds anaconda's
#   kickstart copies, the fragments and itself, and reboots.
# Idempotent: a boot interrupted midway re-runs it.
# Fragments come from the modules that need a human or a booted system.

%post --erroronfail --log=/root/ks-post-980-firstboot.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

cat > /usr/local/sbin/firstboot.sh << 'FIRSTBOOT_SH'
#!/usr/bin/bash
set -euo pipefail
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

echo "=== FIRST BOOT SETUP ==="

# Own the console while prompting: no systemd status lines (SIGRTMIN+21)
# and kernel printk only for emergencies, so late oneshots do not
# interleave with the prompts. Both are in-memory state; a boot resets them.
kill -s SIGRTMIN+21 1
dmesg -n 1

# Static DNS (VPN compatible). Written here, after anaconda is completely
# out of the picture, so nothing overwrites it.
rm -f /etc/resolv.conf
resolvers='@KS_RESOLVERS@'
printf 'nameserver %s\n' ${resolvers//,/} > /etc/resolv.conf
# The recreated file inherited /etc's etc_t; its canonical context is
# net_conf_t, the type confined VPN clients are allowed to manage.
# This runs under the enforcing policy, so the pin is immediate.
restorecon /etc/resolv.conf

# No bootloader password step: sd-boot's editor is off and the cmdline is
# inside the UKI signature.

echo "=== Set password for @KS_ADMIN_USER@ (admin/sudo) ==="
until passwd @KS_ADMIN_USER@; do :; done

echo "=== Set password for @KS_DESKTOP_USER@ (desktop) ==="
until passwd @KS_DESKTOP_USER@; do :; done

# Extension point: modules drop idempotent fragments into /etc/firstboot.d
# (sourced in lexical order, same strict shell; a failing fragment aborts
# firstboot, which re-runs on the next boot).
if [ -d /etc/firstboot.d ]; then
    for frag in /etc/firstboot.d/*.sh; do
        [ -e "$frag" ] || continue
        echo "=== firstboot fragment: $frag ==="
        . "$frag"
    done
fi

# Shred install-time secrets and one-shot code. On a LUKS disk this is
# defense in depth (SSDs may keep remnants); anaconda's reconstructed
# kickstart can embed storage secrets, so it goes first, unconditionally.
for f in /root/anaconda-ks.cfg /root/original-ks.cfg; do
    if [ -f "$f" ]; then shred -u "$f"; fi
done
if [ -d /etc/firstboot.d ]; then
    find /etc/firstboot.d -type f -exec shred -u {} +
    rm -rf /etc/firstboot.d
fi
# disabled only once everything above is gone: an interruption before
# this point re-runs the whole script on the next boot
systemctl disable firstboot.service
rm -f /etc/systemd/system/firstboot.service /etc/systemd/system/getty@.service.d/50-after-firstboot.conf

# finish() is parsed into memory before running, so shredding the
# still-executing script file is safe.
finish() {
    shred -u /usr/local/sbin/firstboot.sh
    echo "=== Setup completed ==="
    sleep 5
    systemctl reboot
}
finish
FIRSTBOOT_SH
chmod 700 /usr/local/sbin/firstboot.sh

cat > /etc/systemd/system/firstboot.service << 'EOF'
[Unit]
Description=First boot interactive setup
# The first boot belongs to this service: it ends in a reboot, so the
# boot updater (450-auto-updates) first runs on the boot after it.
Before=boot-update.service
After=systemd-user-sessions.service

[Service]
Type=oneshot
RemainAfterExit=no

StandardInput=tty-force
StandardOutput=tty
StandardError=tty
TTYPath=/dev/tty1

ExecStart=/usr/local/sbin/firstboot.sh

[Install]
WantedBy=multi-user.target
EOF

systemctl enable firstboot.service

# Every login prompt waits for the setup, which sets the passwords;
# autovt@ aliases the template. Ordering, not Conflicts=: getty@tty1 is
# only Wants-pulled and a Conflicts= would delete its start job outright.
install -d /etc/systemd/system/getty@.service.d
cat > /etc/systemd/system/getty@.service.d/50-after-firstboot.conf << 'EOF'
[Unit]
After=firstboot.service
EOF

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/980-firstboot.sh << 'VERIFY_EOF'
resolvers='@KS_RESOLVERS@'
sh_chk "static DNS in place"               "grep -q 'nameserver ${resolvers%%,*}' /etc/resolv.conf"
sh_chk "canonical label on /etc/resolv.conf" "matchpathcon -V /etc/resolv.conf"
sh_chk "@KS_ADMIN_USER@ password set"      "passwd -S @KS_ADMIN_USER@ | grep -qE '^@KS_ADMIN_USER@ P '"
sh_chk "@KS_DESKTOP_USER@ password set"    "passwd -S @KS_DESKTOP_USER@ | grep -qE '^@KS_DESKTOP_USER@ P '"
VERIFY_EOF
%end
