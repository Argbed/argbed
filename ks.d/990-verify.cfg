# 990-verify: verify-install runs every module's checks after the first login
# Installs /usr/local/sbin/verify-install for root: sources the fragments
#   in /etc/verify.d in name order with chk and sh_chk defined, prints
#   OK/FAIL per check and, when all pass, offers to shred
#   /root/ks-post-*.log and /var/log/anaconda. Re-runnable as a health check.
# A module writes its own checks to /etc/verify.d/NNN-name.sh, so a module
#   that is absent brings no check; a fragment that does not parse is a
#   FAIL; a WARN line counts as neither.
# Names the command on the first-boot screen through a firstboot fragment.

%post --erroronfail --log=/root/ks-post-990-verify.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

cat > /usr/local/sbin/verify-install << 'VERIFY_EOF'
#!/usr/bin/bash
# Post-install verification. Re-runnable; exit 1 if any check fails.
set -uo pipefail
export PATH=/usr/sbin:/usr/bin:/sbin:/bin
[ "$(id -u)" -eq 0 ] || { echo "Run as root (sudo verify-install)." >&2; exit 1; }

pass=0; fail=0
chk() {
    local desc="$1"; shift
    if "$@" >/dev/null 2>&1; then
        echo "  OK    $desc"; pass=$((pass+1))
    else
        echo "  FAIL  $desc"; fail=$((fail+1))
    fi
}
sh_chk() { chk "$1" sh -c "$2"; }

echo "=== post-install verification ==="
for frag in /etc/verify.d/*.sh; do
    [ -e "$frag" ] || continue
    echo "--- $(basename "$frag" .sh) ---"
    # sourcing stops at a syntax error and goes on with the next fragment,
    # which would read as a shorter clean run
    if bash -n "$frag"; then . "$frag"; else echo "  FAIL  fragment does not parse"; fail=$((fail+1)); fi
done

echo
echo "Result: $pass passed, $fail failed"
[ "$fail" -eq 0 ] || { echo "Investigate failures before shredding logs: /root/ks-post-*.log, /var/log/anaconda/, journalctl -b -1"; exit 1; }

echo
echo "Install-time artifacts still on disk:"
left=
for p in /root/ks-post-*.log /var/log/anaconda; do
    [ -e "$p" ] || continue
    echo "  $p"; left=1
done
[ -n "$left" ] || { echo "  none, already shredded."; exit 0; }
read -r -p "All checks passed. Shred them now? (yes/NO): " ans
if [ "$ans" = "yes" ]; then
    for f in /root/ks-post-*.log; do
        if [ -f "$f" ]; then shred -u "$f"; fi
    done
    if [ -d /var/log/anaconda ]; then
        find /var/log/anaconda -type f -exec shred -u {} +
        rm -rf /var/log/anaconda
    fi
    echo "Shredded."
    if [ -f /root/uki-notes.txt ]; then
        echo "(/root/uki-notes.txt kept: recovery notes, no secrets.)"
    fi
fi
VERIFY_EOF
chmod 700 /usr/local/sbin/verify-install

install -d -m 700 /etc/firstboot.d
cat > /etc/firstboot.d/990-verify.sh << 'FRAG_EOF'
echo "After the reboot: log in as @KS_ADMIN_USER@ and run: sudo verify-install"
FRAG_EOF
%end
