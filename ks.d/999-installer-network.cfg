# 999-installer-network: exposure reading, connection check, DNS pin, last
# Sorts after every other %pre, so the install needs a connection only
#   from here: stock media has no packet filter, and the window lasts
#   until the installer reboots. Lists TCP services listening beyond
#   loopback and asks for YES; offers an ethernet retry or a WiFi join
#   into the installer's NetworkManager.
# Pins the installer's DNS to the resolvers the installed system uses,
#   reverting where the network blocks them.

%pre --erroronfail --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
exec < /dev/tty3 > /dev/tty3 2>&1
chvt 3

# The installer's systemd-resolved listens for LLMNR beyond loopback by
# default; the install needs unicast DNS only, so multicast resolution
# goes off before the exposure reading below.
if systemctl -q is-active systemd-resolved 2>/dev/null; then
    mkdir -p /etc/systemd/resolved.conf.d
    printf '[Resolve]\nLLMNR=no\nMulticastDNS=no\n' \
        > /etc/systemd/resolved.conf.d/90-no-multicast.conf
    systemctl restart systemd-resolved 2>/dev/null || true
fi

# Stock media ships no netfilter module, so filtering cannot start before
# the installed system's first boot. Listening sockets come from /proc/net
# (the media has awk, not ss); a TCP listener beyond loopback needs YES.
echo
echo "Install-time network exposure:"
tcp_exposed=$(awk 'FNR>1 && $4=="0A" { split($2,a,":");
        if (a[1] !~ /7F$/ && a[1] != "00000000000000000000000001000000")
            printf "  TCP port %d\n", strtonum("0x" a[2]) }' \
        /proc/net/tcp /proc/net/tcp6 2>/dev/null | sort -u || true)
udp_exposed=$(awk 'FNR>1 && $3 ~ /^0+:0000$/ { split($2,a,":");
        if (a[1] !~ /7F$/ && a[1] != "00000000000000000000000001000000")
            printf "  UDP port %d\n", strtonum("0x" a[2]) }' \
        /proc/net/udp /proc/net/udp6 2>/dev/null | sort -u || true)
if [ -n "$tcp_exposed" ]; then
    echo "WARNING: TCP services are listening beyond loopback:"
    echo "$tcp_exposed"
    echo "They may be reachable from the network during the installation."
    read -r -p "Type YES to continue anyway: " LOK
    [ "$LOK" = "YES" ] || exit 1
else
    echo "  no TCP service listening beyond loopback."
fi
if [ -n "$udp_exposed" ]; then
    echo "  UDP ports bound beyond loopback (a DHCP client typically binds 68):"
    echo "$udp_exposed"
fi

# Everything installs over HTTPS: no usable network means a certain
# failure later, so the check is here, with recovery offered.
while ! curl -sfm 15 -o /dev/null https://mirrors.fedoraproject.org/; do
    echo
    echo "No usable network connection detected."
    echo "  - plug in an ethernet cable, wait a few seconds, press Enter to retry"
    if command -v nmcli >/dev/null 2>&1; then
        echo "  - or type 'wifi' to join a wireless network"
    fi
    read -r -p "> " NETCHOICE
    if [ "$NETCHOICE" = "wifi" ]; then
        if command -v nmcli >/dev/null 2>&1; then
            nmcli device wifi rescan 2>/dev/null || true
            sleep 3
            nmcli device wifi list 2>/dev/null | head -15 || true
            read -r -p "SSID: " SSID
            read -r -s -p "WiFi passphrase: " WPSK; echo
            nmcli device wifi connect "$SSID" password "$WPSK" \
                || echo "Connection failed, try again."
        else
            echo "WiFi join unavailable: this installer environment has no nmcli."
        fi
    fi
done
echo "Network OK."

# mirror lookups stay off the DHCP resolver, and anaconda copies this
# resolv.conf into the chroot
resolvers='@KS_RESOLVERS@'
pin_dns() {
    local mode="$1" con
    while IFS= read -r con; do
        [ -n "$con" ] || continue
        if [ "$mode" = pin ]; then
            nmcli connection modify "$con" ipv4.dns "${resolvers//,/}" ipv4.ignore-auto-dns yes 2>/dev/null || true
        else
            nmcli connection modify "$con" ipv4.dns "" ipv4.ignore-auto-dns no 2>/dev/null || true
        fi
        nmcli connection up "$con" >/dev/null 2>&1 || true
    done < <(nmcli -t -f NAME connection show --active 2>/dev/null)
}
pin_dns pin
sleep 2   # resolv.conf is rewritten asynchronously after connection re-up
if ! curl -sfm 15 -o /dev/null https://mirrors.fedoraproject.org/; then
    echo "Network unreachable with pinned DNS: reverting to the network-provided DNS."
    pin_dns revert
elif grep -qF "${resolvers%%,*}" /etc/resolv.conf 2>/dev/null; then
    echo "Installer DNS pinned to $resolvers (present in resolv.conf)."
else
    echo "DNS pin not applied here: continuing with the network-provided DNS."
    pin_dns revert
fi

chvt 1
%end
