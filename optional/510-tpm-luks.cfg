# 510-tpm-luks: TPM2+PIN LUKS keyslot, enrolled on the first boot
# Installs tpm2-tss. Skips itself when no TPM2 device exists.
# The firstboot fragment enrolls the root filesystem's own LUKS partition:
#   it asks for the passphrase, then a new PIN, binds the slot to PCR 7 and
#   adds tpm2-device=auto to that partition's crypttab line; the passphrase
#   stays as recovery. Turning Secure Boot off or changing firmware keys
#   locks the TPM slot out.
# A recovery-passphrase prompt where the PIN prompt is expected means the
#   sealed state changed: a tamper signal, examined from a live USB.
# Independent of the UKI module.

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
# TSS libraries systemd-cryptenroll/-cryptsetup dlopen for TPM2 support
tpm2-tss
%end

%post --erroronfail --log=/root/ks-post-510-tpm-luks.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

install -d -m 700 /etc/firstboot.d
cat > /etc/firstboot.d/510-tpm.sh << 'FRAG_EOF'
# the resource manager node is the one systemd-cryptenroll enumerates
if [ ! -e /dev/tpmrm0 ]; then
    echo "No TPM2 device found: TPM enrollment skipped, unlock stays passphrase-only."
else
    # the root filesystem's own LUKS partition, whatever other encrypted
    # disks or sticks are attached
    rootmap=$(findmnt -no SOURCE /)
    luksdev=$(lsblk -nso PATH,TYPE "$rootmap" | awk '$2=="part"{print $1; exit}')
    if [ -z "$luksdev" ]; then
        echo "WARNING: no LUKS partition under the root filesystem; skipping TPM enrollment."
    else
        slot=""
        if cryptsetup luksDump "$luksdev" | grep -q systemd-tpm2; then
            echo "TPM2 keyslot already enrolled on $luksdev."
            slot=1
        else
            echo "=== Enroll TPM2+PIN LUKS keyslot on $luksdev ==="
            echo "You will be asked for the CURRENT LUKS passphrase, then a new PIN."
            echo "The passphrase remains valid as recovery; if the machine ever asks"
            echo "for it unexpectedly instead of the PIN, treat it as tampering."
            for _ in 1 2 3; do
                if systemd-cryptenroll --tpm2-device=auto --tpm2-with-pin=yes \
                        --tpm2-pcrs=7 "$luksdev"; then
                    slot=1
                    break
                fi
                echo "Enrollment failed."
            done
        fi
        if [ -z "$slot" ]; then
            echo "WARNING: TPM2 enrollment failed three times: unlock stays passphrase-only."
        else
            # the initramfs tries the TPM at boot and prompts for the PIN;
            # only the root mapping's line changes, a re-run changes nothing
            ( umask 077; awk -v n="${rootmap##*/}" '!/^#/ && NF>=3 && $1==n && $0 !~ /tpm2-device/ {
                     if (NF==3) { $0 = $0" tpm2-device=auto" }
                     else       { $4 = $4",tpm2-device=auto" }
                 } { print }' /etc/crypttab > /etc/crypttab.new )
            mv /etc/crypttab.new /etc/crypttab
            # rebuilt on every run: an interrupted run must not leave an
            # initramfs without the TPM path behind an edited crypttab
            echo "Rebuilding the initramfs with TPM2 unlock..."
            kernel-install add "$(uname -r)" "/lib/modules/$(uname -r)/vmlinuz"
        fi
    fi
fi
FRAG_EOF
chmod 700 /etc/firstboot.d/510-tpm.sh

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/510-tpm-luks.sh << 'VERIFY_EOF'
if [ -e /dev/tpmrm0 ]; then
    rootmap=$(findmnt -no SOURCE /)
    luksdev=$(lsblk -nso PATH,TYPE "$rootmap" | awk '$2=="part"{print $1; exit}')
    sh_chk "TPM2 keyslot on the root LUKS partition" "cryptsetup luksDump $luksdev | grep -q systemd-tpm2"
    sh_chk "crypttab unlocks root through the TPM" "grep -qE '^${rootmap##*/}[[:space:]].*tpm2-device=auto' /etc/crypttab"
else
    echo "  WARN  no TPM2 device: no keyslot enrolled, unlock stays passphrase-only"
fi
VERIFY_EOF
%end
