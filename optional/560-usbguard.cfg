# 560-usbguard: USB devices not present during installation are blocked
# Installs usbguard; the allowlist is generated from the devices attached
#   while the installer runs, so a keyboard on another port or hub may
#   enumerate differently and be blocked. /etc/usbguard/rules.conf is
#   editable from a session that is already logged in.

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
usbguard
%end

%post --erroronfail --log=/root/ks-post-560-usbguard.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

( umask 077; usbguard generate-policy > /etc/usbguard/rules.conf )
systemctl enable usbguard

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/560-usbguard.sh << 'VERIFY_EOF'
sh_chk "usbguard active"                   "systemctl is-active usbguard"
sh_chk "usbguard policy present"           "test -s /etc/usbguard/rules.conf"
VERIFY_EOF
%end
