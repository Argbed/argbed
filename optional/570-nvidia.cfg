# 570-nvidia: NVIDIA proprietary driver from RPM Fusion, modules signed
# Does nothing but write /root/gpu-report.txt when no NVIDIA GPU exists;
#   Intel, AMD and nouveau need no module.
# Requires the UKI module's key and firmware with Secure Boot support:
#   modules are signed at build time with the machine key (readable by
#   the akmods account, 0440 root:akmods) and rebuilt by akmods.service
#   after each kernel update, which can take minutes on that boot.
# RPM Fusion release rpms are checked against the keys Fedora ships in
#   distribution-gpg-keys before they install; its metadata is unsigned.
# The UKIs are rebuilt with nouveau and nova_core blacklisted; a sway
#   wrapper adds --unsupported-gpu. Expect about 1 GiB of hard
#   dependencies. NVIDIA_SERIES below selects a legacy branch.

%post --erroronfail --log=/root/ks-post-570-nvidia.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

# "" = current driver; "580xx" Maxwell/Pascal/Volta, "470xx" Kepler,
# "390xx" Fermi; older cards have no proprietary driver (nouveau works)
NVIDIA_SERIES=""

report=/root/gpu-report.txt
: > "$report"
chmod 600 "$report"

found_nvidia=0
for dev in /sys/bus/pci/devices/*; do
    class=$(<"$dev/class")
    case "$class" in 0x03*) ;; *) continue ;; esac
    vendor=$(<"$dev/vendor")
    device=$(<"$dev/device")
    case "$vendor" in
        0x8086) name="Intel (not an NVIDIA device, outside this module's scope)" ;;
        0x1002) name="AMD/ATI (not an NVIDIA device, outside this module's scope)" ;;
        0x10de) name="NVIDIA"; found_nvidia=1 ;;
        *)      name="unknown vendor $vendor" ;;
    esac
    echo "GPU $vendor:$device, $name" >> "$report"
done

if [ "$found_nvidia" != 1 ]; then
    echo "No NVIDIA GPU found: proprietary driver NOT installed; nothing changed." >> "$report"
    exit 0
fi

[ -f /etc/pki/uki/uki.der ] || { echo "ERROR: 570-nvidia requires the 500-uki-boot signing key"; exit 1; }

# mokutil refuses every enrollment operation on firmware without a
# SecureBoot variable, so the signed module would be rejected at every
# load: the install fails here, not as a broken desktop (nouveau works).
[ -e /sys/firmware/efi/efivars/SecureBoot-8be4df61-93ca-11d2-aa0d-00e098032b8c ] \
    || { echo "ERROR: firmware has no Secure Boot support, so the machine key can never be MOK-enrolled and the signed nvidia module would never load (module.sig_enforce=1). Use nouveau."; exit 1; }

rel=$(rpm -E %fedora)
# release rpms checked against Fedora's distribution-gpg-keys; dnf verifies
# the URL rpms (localpkg_gpgcheck is off by default)
dnf install -y distribution-gpg-keys
rpm --import "/usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-${rel}" \
             "/usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-nonfree-fedora-${rel}"
dnf remove -y distribution-gpg-keys
# akmods/kmodtool live in the free repo; the driver in nonfree.
dnf install -y --setopt=localpkg_gpgcheck=1 \
    "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-${rel}.noarch.rpm" \
    "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-${rel}.noarch.rpm"
# https mirrors only: the installed system's egress drops port 80. Appended
# in place: the files are config(noreplace).
sed -i '/^metalink=/ { /protocol=https/! s/$/\&protocol=https/ }' /etc/yum.repos.d/rpmfusion-*.repo
# gcc/make explicit: dnf runs with weak deps off and akmodsbuild does not
# resolve BuildRequires. kernel-devel is pinned per installed kernel: the
# bare name resolves to the newest version, not each kernel on disk.
devel_pkgs=()
for kdir in /lib/modules/*/; do
    kv=$(basename "$kdir")
    [ -f "$kdir/vmlinuz" ] || continue
    devel_pkgs+=("kernel-devel-$kv")
done
dnf install -y gcc make "${devel_pkgs[@]}" "akmod-nvidia${NVIDIA_SERIES:+-$NVIDIA_SERIES}"

# akmods builds and signs as the akmods user and only signs when that user
# can read a keypair at its canonical paths; an unreadable key SKIPS
# SIGNING WITHOUT AN ERROR, which the signer check after the build catches.
ln -sf /etc/pki/uki/uki.key /etc/pki/akmods/private/private_key.priv
ln -sf /etc/pki/uki/uki.der /etc/pki/akmods/certs/public_key.der
chgrp akmods /etc/pki/uki /etc/pki/uki/uki.key /etc/pki/uki/uki.der
chmod 710 /etc/pki/uki
chmod 440 /etc/pki/uki/uki.key
chmod 640 /etc/pki/uki/uki.der

# Wayland needs KMS, set here independent of packaging defaults.
echo "options nvidia-drm modeset=1" > /etc/modprobe.d/nvidia-kms.conf

# The packaging keeps nouveau and nova_core off the GPU only by injecting
# kernel args through grubby, which edits BLS entries this system lacks;
# the args go into the UKI cmdline source and the rebuild bakes them in.
NOUVEAU_OFF='rd.driver.blacklist=nouveau,nova_core modprobe.blacklist=nouveau,nova_core'
kernel_cmdline=
. /etc/dracut.conf.d/96-uki-cmdline.conf
[ -n "$kernel_cmdline" ] || { echo "ERROR: no kernel_cmdline in /etc/dracut.conf.d/96-uki-cmdline.conf (500-uki-boot writes it)"; exit 1; }
case "$kernel_cmdline" in
    *"$NOUVEAU_OFF"*) ;;
    *) printf 'kernel_cmdline="%s %s"\n' "$kernel_cmdline" "$NOUVEAU_OFF" \
           > /etc/dracut.conf.d/96-uki-cmdline.conf ;;
esac

# Built and signed during the install, so the FIRST boot has a signed driver.
for kdir in /lib/modules/*/; do
    kv=$(basename "$kdir")
    [ -f "$kdir/vmlinuz" ] || continue
    akmods --force --kernels "$kv"
done

# Upstream treats a missing/unreadable key as "don't sign", not as an
# error; it is caught here, not as a boot-time module rejection
# (module.sig_enforce=1 refuses unsigned modules).
for kdir in /lib/modules/*/; do
    kv=$(basename "$kdir")
    [ -f "$kdir/vmlinuz" ] || continue
    modinfo -k "$kv" -F signer nvidia 2>/dev/null | grep -q 'Secure Boot Signing Key' \
        || { echo "ERROR: nvidia module for $kv built unsigned"; exit 1; }
done
systemctl enable akmods

echo "- Module signing (570-nvidia): signing key is 0440 root:akmods so akmods can rebuild+sign after kernel updates." >> /root/uki-notes.txt

# The nvidia modules stay out of the initramfs (the packaging ships
# omit_drivers): the console runs on simpledrm, the driver binds after
# switch-root.
for kdir in /lib/modules/*/; do
    kv=$(basename "$kdir")
    [ -f "$kdir/vmlinuz" ] || continue
    kernel-install add "$kv" "$kdir/vmlinuz"
done

# sway refuses the proprietary driver without this flag; /usr/local/bin
# precedes /usr/bin in PATH, so the tty1 autostart picks it up unchanged.
cat > /usr/local/bin/sway << 'EOF'
#!/usr/bin/bash
exec /usr/bin/sway --unsupported-gpu "$@"
EOF
chmod 755 /usr/local/bin/sway

{
    echo "NVIDIA proprietary driver installed: akmod-nvidia${NVIDIA_SERIES:+-$NVIDIA_SERIES}"
    echo "Modules signed with the machine key (check: modinfo -F signer nvidia)"
    echo "akmods.service is enabled: after a kernel update, the module for the"
    echo "new kernel should be built during the following boot (can take minutes)."
} >> "$report"

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/570-nvidia.sh << 'VERIFY_EOF'
sh_chk "nvidia module signed (machine key)" "modinfo -F signer nvidia 2>/dev/null | grep -qi 'Secure Boot Signing Key'"
sh_chk "nouveau blacklisted (booted cmdline)" "grep -q 'modprobe.blacklist=nouveau,nova_core' /proc/cmdline"
sh_chk "nvidia driver bound to a GPU"       "ls /sys/bus/pci/drivers/nvidia/0000:*"
sh_chk "signing key shared read-only with akmods" "stat -c '%a %U %G' /etc/pki/uki/uki.key | grep -qx '440 root akmods'"
VERIFY_EOF
%end
