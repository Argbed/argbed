# 600-openvpn: OpenVPN client as confined openvpn-client@<name> units
# Installs openvpn. One server config per file in /etc/openvpn/client,
#   root:root 0600 with every referenced file; the packaged unit runs it
#   in the openvpn_t domain with its sandbox and survives logout.
# Instances start after the boot-time updater (450-auto-updates), so
#   the update window stays off the tunnel.
# The unit sets no Restart=: when openvpn exits, traffic returns to the
#   bare NIC, and a socket bound to the NIC by name bypasses its routes
#   even while it is up. The endpoint must be accepted by the egress
#   firewall, pinned by IP and port. Setup and DNS: README, "VPN".

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
openvpn
%end

%post --erroronfail --log=/root/ks-post-600-openvpn.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

# Template drop-in: a *@.service.d directory applies to every instance.
install -d /etc/systemd/system/openvpn-client@.service.d
cat > /etc/systemd/system/openvpn-client@.service.d/50-boot-update.conf << 'EOF'
[Unit]
After=boot-update.service
EOF
%end
