# 605-openvpn-killswitch: egress only through OpenVPN's tun interfaces
# Requires 600-openvpn. Appends a second output chain to the ruleset of
#   420-firewall: that allowlist decides WHAT may leave, this chain
#   decides WHERE. Off-tunnel egress is DHCPv4 renewals and the handshake
#   to the IPs in the vpn_endpoints set; tunnel down means offline.
# REQUIRED EDIT: the endpoint IPs in the set and the port (and tcp for
#   proto tcp) in the handshake rule; the set ships empty, and empty it
#   blocks the handshake, so an unedited install is offline, not leaking.
# The endpoint also needs the pinned rule in 420-firewall; "remote" lines
#   must be IPs; a split-tunnel config's off-tunnel flows are dropped;
#   WireGuard is not matched.

%post --erroronfail --log=/root/ks-post-605-openvpn-killswitch.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

# All %packages install before the first %post runs, so 600-openvpn's
# package is already testable here.
rpm -q openvpn >/dev/null 2>&1 \
    || { echo "ERROR: 605-openvpn-killswitch requires optional/600-openvpn: without a VPN client the pin below is a permanent egress blackout."; exit 1; }

[ -f /etc/sysconfig/nftables.conf ] \
    || { echo "ERROR: /etc/sysconfig/nftables.conf missing (420-firewall writes it)"; exit 1; }

cat >> /etc/sysconfig/nftables.conf << 'EOF'

# OpenVPN kill switch: a packet must be accepted by every chain on a
# hook, so this second output chain confines the allowlist above to the
# tunnel. Lift until the next restart: nft delete table inet killswitch
table inet killswitch {
    # a set, not a port-only rule: off-tunnel, any host on this port would pass
    set vpn_endpoints {
        type ipv4_addr
        # REQUIRED EDIT: uncomment with the provider's endpoint IPs
        # (the config's "remote" lines)
        # elements = { 203.0.113.7, 203.0.113.9 }
    }
    chain output {
        type filter hook output priority -10;
        policy drop;
        oif "lo" accept
        oifname "tun*" accept comment "VPN tunnel"
        udp sport 68 udp dport 67 accept comment "DHCPv4 client renewals"
        ip daddr @vpn_endpoints udp dport 1194 accept comment "VPN endpoint handshake on the provider's port"
    }
}
EOF

# Updates ride the tunnel: every openvpn-client@ instance starts before
# the boot-time updater, replacing 600's drop-in of the same name. A
# dead endpoint delays the updater by the unit's start timeout.
install -d /etc/systemd/system/openvpn-client@.service.d
cat > /etc/systemd/system/openvpn-client@.service.d/50-boot-update.conf << 'EOF'
[Unit]
Before=boot-update.service
EOF

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/605-openvpn-killswitch.sh << 'VERIFY_EOF'
# a parse error anywhere in nftables.conf loads nothing and keeps networkd
# down, so the table is read back from the kernel, not from the file
sh_chk "OpenVPN kill switch active (tun-only egress)" "nft list chain inet killswitch output | grep -q 'policy drop'"
# an empty set means the endpoint edit is missing: the handshake is
# blocked and the tunnel can never come up
sh_chk "OpenVPN kill switch endpoint IPs listed" "nft list set inet killswitch vpn_endpoints | grep -q elements"
VERIFY_EOF
%end
