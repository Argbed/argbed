# 610-wireguard: WireGuard client as confined wg-quick@<name> units
# Installs wireguard-tools; the data path is the in-tree kernel module,
#   Fedora-signed, so no MOK or akmods. One config in /etc/wireguard,
#   root:root 0600; the unit runs wg-quick in the wireguard_t domain, a
#   manual wg-quick gets no transition.
# Every wg-quick@ instance starts before the boot-time updater, so
#   updates ride the tunnel.
# A full-tunnel config blackholes traffic while the interface is up with
#   a dead endpoint, but a socket bound to the NIC by name bypasses the
#   policy routing, and with the interface down the bare NIC is used.
# Provider configs need their DNS= and IPv6 entries removed, an IP in
#   Endpoint= and a firewall rule for it. Details: README, "VPN".

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
wireguard-tools
%end

%post --erroronfail --log=/root/ks-post-610-wireguard.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

# Template drop-in: a *@.service.d directory applies to every instance.
install -d /etc/systemd/system/wg-quick@.service.d
cat > /etc/systemd/system/wg-quick@.service.d/50-before-boot-update.conf << 'EOF'
[Unit]
Before=boot-update.service
EOF
%end
