# 615-wireguard-killswitch: egress only through wg* interfaces
# Requires 610-wireguard. A second output chain on the ruleset of
#   420-firewall: that allowlist decides WHAT may leave, this chain
#   decides WHERE; off-tunnel egress is DHCPv4 renewals and the
#   handshake to the vpn_endpoints set, so interface down means offline.
# REQUIRED EDIT: the endpoint IP in the set and the port in the handshake
#   rule; the set ships empty, and empty it blocks the handshake, so an
#   unedited install is offline, not leaking.
# Configs must be named wg*.conf; Endpoint= must be an IP and also pass
#   420-firewall; a split-tunnel config's off-tunnel flows are dropped.
#   Never together with 605-openvpn-killswitch: each drops the other's tunnel.
# With openvpn present, tun* is accepted for a nested inner VPN: README, "VPN".

%post --erroronfail --log=/root/ks-post-615-wireguard-killswitch.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

# All %packages install before the first %post runs, so 610-wireguard's
# package is already testable here.
rpm -q wireguard-tools >/dev/null 2>&1 \
    || { echo "ERROR: 615-wireguard-killswitch requires optional/610-wireguard: without a VPN client the pin below is a permanent egress blackout."; exit 1; }

[ -f /etc/sysconfig/nftables.conf ] \
    || { echo "ERROR: /etc/sysconfig/nftables.conf missing (420-firewall writes it)"; exit 1; }
! grep -q '^table inet killswitch {' /etc/sysconfig/nftables.conf \
    || { echo "ERROR: 605-openvpn-killswitch is present: the two kill switches drop each other's tunnel."; exit 1; }

cat >> /etc/sysconfig/nftables.conf << 'EOF'

# WireGuard kill switch: a packet must be accepted by every chain on a
# hook, so this second output chain confines the allowlist above to the
# tunnel. Lift until the next restart: nft delete table inet killswitch_wg
table inet killswitch_wg {
    # a set, not a port-only rule: off-tunnel, any host on this port would pass
    set vpn_endpoints {
        type ipv4_addr
        # REQUIRED EDIT: uncomment with the provider's endpoint IP
        # (the config's "Endpoint =" line)
        # elements = { 203.0.113.7 }
    }
    chain output {
        type filter hook output priority -10;
        policy drop;
        oif "lo" accept
        oifname "wg*" accept comment "VPN tunnel"
        # with openvpn: tun* only feeds openvpn, whose resends must use wg*
        # oifname "tun*" accept comment "nested VPN payload"
        udp sport 68 udp dport 67 accept comment "DHCPv4 client renewals"
        ip daddr @vpn_endpoints udp dport 51820 accept comment "VPN endpoint handshake on the provider's port"
    }
}
EOF

# Nested inner VPN: tun* accepted in the chain; openvpn-client@ instances
# start after every enabled wg-quick@ instance (each is ordered before
# wg-quick.target and pulled in by it), and after the updater (600).
if rpm -q openvpn >/dev/null 2>&1; then
    sed -i 's/^        # oifname "tun\*" accept comment "nested VPN payload"$/        oifname "tun*" accept comment "nested VPN payload"/' /etc/sysconfig/nftables.conf
    install -d /etc/systemd/system/openvpn-client@.service.d
    cat > /etc/systemd/system/openvpn-client@.service.d/50-nested.conf << 'EOF'
[Unit]
Wants=wg-quick.target
After=wg-quick.target
EOF
fi

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/615-wireguard-killswitch.sh << 'VERIFY_EOF'
# a parse error anywhere in nftables.conf loads nothing and keeps networkd
# down, so the table is read back from the kernel, not from the file
sh_chk "WireGuard kill switch active (wg-only egress)" "nft list chain inet killswitch_wg output | grep -q 'policy drop'"
# an empty set means the endpoint edit is missing: the handshake is
# blocked and the tunnel can never come up
sh_chk "WireGuard kill switch endpoint IPs listed" "nft list set inet killswitch_wg vpn_endpoints | grep -q elements"
VERIFY_EOF
%end
