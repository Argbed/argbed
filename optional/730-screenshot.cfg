# 730-screenshot: screenshots and screen sharing for sway
# Installs grim, slurp, wl-clipboard and the wlr and gtk portals; appends
#   Print (region to clipboard as image/png) and Shift+Print (region to a
#   file in $HOME) to the sway config from 710-sway.

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
grim
slurp
wl-clipboard
xdg-desktop-portal-wlr
xdg-desktop-portal-gtk
%end

%post --erroronfail --log=/root/ks-post-730-screenshot.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

SKEL=/etc/skel

[ -f "$SKEL/.config/sway/config" ] \
    || { echo "ERROR: 730-screenshot appends to the sway config that 710-sway writes."; exit 1; }
cat >> "$SKEL/.config/sway/config" << 'EOF'

# Screenshots: Print -> clipboard, Shift+Print -> file in $HOME. The
# clipboard type is explicit: wl-copy infers it through xdg-mime, which
# is not installed, and otherwise offers the data as text/plain.
bindsym Print exec /usr/bin/grim -g "$(/usr/bin/slurp)" - | /usr/bin/wl-copy --type image/png
bindsym Shift+Print exec GRIM_DEFAULT_DIR="$HOME" /usr/bin/grim -g "$(/usr/bin/slurp)"
EOF

install -d -m 700 "$SKEL/.config/xdg-desktop-portal"
cat > "$SKEL/.config/xdg-desktop-portal/sway-portals.conf" << 'EOF'
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
EOF
chmod 600 "$SKEL/.config/xdg-desktop-portal/sway-portals.conf"
%end
