# 740-playerctl: media keys for MPRIS players
# Installs playerctl; appends the XF86Audio bindings to the sway config
#   from 710-sway.

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
playerctl
%end

%post --erroronfail --log=/root/ks-post-740-playerctl.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

[ -f /etc/skel/.config/sway/config ] \
    || { echo "ERROR: 740-playerctl appends to the sway config that 710-sway writes."; exit 1; }
cat >> /etc/skel/.config/sway/config << 'EOF'

# Media keys (optional/740-playerctl)
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPause exec playerctl play-pause
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioPrev exec playerctl previous
EOF
%end
