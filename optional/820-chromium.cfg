# 820-chromium: second browser, hardened by managed policy
# hardening.json fixes its settings for all profiles, incognito included;
#   master_preferences seeds new profiles; chromium.conf holds switches.
# Off: metrics, deep scanning, password manager, autofill, sign-in, sync,
#   suggestions, spell check, translation, preloading, background mode,
#   ad auction APIs, media router, import, AI Mode, JIT, optimizer, DNS
#   over HTTPS (a VPN captures system DNS). On: HTTPS-only, third-party
#   cookies blocked, WebRTC on the public interface only, download
#   location asked, DuckDuckGo; site permissions blocked by default,
#   local and private networks too.
# Still leaving: component updates, Safe Browsing lists, account-list request.
# Disables avahi-daemon, pulled in by nss-mdns; adds $mod+c to sway.

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
chromium
%end

%post --erroronfail --log=/root/ks-post-820-chromium.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

# Fedora's preset enables the avahi daemon that nss-mdns pulls in; disabling
# the service also disables its socket and D-Bus alias (Also=, Alias=).
systemctl disable avahi-daemon

install -d -m 755 /etc/chromium/policies/managed
cat > /etc/chromium/policies/managed/hardening.json << 'EOF'
{
  "MetricsReportingEnabled": false,
  "SafeBrowsingProtectionLevel": 1,
  "SafeBrowsingProxiedRealTimeChecksAllowed": false,
  "SafeBrowsingDeepScanningEnabled": false,
  "SafeBrowsingSurveysEnabled": false,
  "PasswordManagerEnabled": false,
  "PasswordLeakDetectionEnabled": false,
  "AutofillAddressEnabled": false,
  "AutofillCreditCardEnabled": false,
  "PaymentMethodQueryEnabled": false,
  "BrowserSignin": 0,
  "SyncDisabled": true,
  "SearchSuggestEnabled": false,
  "DefaultSearchProviderEnabled": true,
  "DefaultSearchProviderName": "DuckDuckGo",
  "DefaultSearchProviderSearchURL": "https://duckduckgo.com/?q={searchTerms}",
  "SpellcheckEnabled": false,
  "TranslateEnabled": false,
  "NetworkPredictionOptions": 2,
  "BackgroundModeEnabled": false,
  "UrlKeyedAnonymizedDataCollectionEnabled": false,
  "BrowserNetworkTimeQueriesEnabled": false,
  "AlternateErrorPagesEnabled": false,
  "PromotionsEnabled": false,
  "DefaultBrowserSettingEnabled": false,
  "EnableMediaRouter": false,
  "ImportBookmarks": false,
  "ImportHistory": false,
  "ImportSavedPasswords": false,
  "ImportSearchEngine": false,
  "ImportAutofillFormData": false,
  "ImportHomepage": false,
  "BrowserLabsEnabled": false,
  "FeedbackSurveysEnabled": false,
  "UserFeedbackAllowed": false,
  "ShoppingListEnabled": false,
  "HistoryClustersVisible": false,
  "LensRegionSearchEnabled": false,
  "GoogleSearchSidePanelEnabled": false,
  "SideSearchEnabled": false,
  "MediaRecommendationsEnabled": false,
  "LiveCaptionEnabled": false,
  "AccessibilityImageLabelsEnabled": false,
  "DomainReliabilityAllowed": false,
  "WPADQuickCheckEnabled": false,
  "RemoteDebuggingAllowed": false,
  "AIModeSettings": 1,
  "DefaultJavaScriptJitSetting": 2,
  "DefaultJavaScriptOptimizerSetting": 2,
  "HttpsOnlyMode": "force_enabled",
  "BlockThirdPartyCookies": true,
  "WebRtcIPHandling": "default_public_interface_only",
  "WebRtcEventLogCollectionAllowed": false,
  "DnsOverHttpsMode": "off",
  "DefaultGeolocationSetting": 2,
  "DefaultNotificationsSetting": 2,
  "VideoCaptureAllowed": false,
  "AudioCaptureAllowed": false,
  "DefaultSensorsSetting": 2,
  "DefaultWebBluetoothGuardSetting": 2,
  "DefaultWebUsbGuardSetting": 2,
  "DefaultSerialGuardSetting": 2,
  "DefaultWebHidGuardSetting": 2,
  "DefaultFileSystemReadGuardSetting": 2,
  "DefaultFileSystemWriteGuardSetting": 2,
  "DefaultLocalFontsSetting": 2,
  "DefaultWindowManagementSetting": 2,
  "DefaultClipboardSetting": 2,
  "DefaultAutomaticDownloadsSetting": 2,
  "DefaultIdleDetectionSetting": 2,
  "AutomaticFullscreenBlockedForUrls": ["*"],
  "LocalNetworkAccessBlockedForUrls": ["*"],
  "LocalNetworkBlockedForUrls": ["*"],
  "LoopbackNetworkBlockedForUrls": ["*"],
  "AutoplayAllowed": false,
  "PromptForDownloadLocation": true,
  "HomepageIsNewTabPage": true,
  "NewTabPageLocation": "about:blank",
  "ShowHomeButton": false,
  "RestoreOnStartup": 5
}
EOF
chmod 644 /etc/chromium/policies/managed/hardening.json

# no policy reaches the model manifest fetch or the ad auction APIs (the
# deprecated Privacy Sandbox one leaves them usable); the wrapper reads
# these switches from its conf, whose rpm updates then land as .rpmnew
sed -i 's/^DISABLE_FEATURES="/DISABLE_FEATURES="OptimizationHints,/' /etc/chromium/chromium.conf
grep -q '^DISABLE_FEATURES="OptimizationHints,' /etc/chromium/chromium.conf \
    || { echo "ERROR: /etc/chromium/chromium.conf has no DISABLE_FEATURES line to extend"; exit 1; }
echo 'CHROMIUM_FLAGS+=" --disable-blink-features=AdInterestGroupAPI,Fledge,FencedFrames"' >> /etc/chromium/chromium.conf

# master_preferences seeds a new profile's Preferences: first-run tabs and
# settings chromium has no policy for (all 2 = block); the rpm owns it as
# plain config, so an update that changes it restores Fedora's copy
cat > /etc/chromium/master_preferences << 'EOF'
{
  "homepage_is_newtabpage": true,
  "first_run_tabs": [],
  "credentials_enable_autosignin": false,
  "custom_handlers": { "enabled": false },
  "autofill": { "email_verification_enabled": false },
  "browser": {
    "theme": { "color_scheme2": 2 }
  },
  "profile": {
    "default_content_setting_values": {
      "background_sync": 2,
      "midi_sysex": 2,
      "payment_handler": 2,
      "ar": 2,
      "vr": 2,
      "hand_tracking": 2,
      "storage_access": 2,
      "top_level_storage_access": 2,
      "federated_identity_api": 2,
      "auto_picture_in_picture": 2,
      "captured_surface_control": 2,
      "web_app_installation": 2,
      "speaker_selection": 2,
      "smart_card_guard": 2,
      "web_printing": 2,
      "on_device_speech_recognition": 2
    }
  }
}
EOF
chmod 644 /etc/chromium/master_preferences

# the keybinding needs the sway config 710-sway writes; the browser itself
# does not
if [ -f /etc/skel/.config/sway/config ]; then
    cat >> /etc/skel/.config/sway/config << 'EOF'

# Chromium (optional/820-chromium)
bindsym $mod+c exec chromium-browser
EOF
fi

install -d -m 700 /etc/verify.d
cat > /etc/verify.d/820-chromium.sh << 'VERIFY_EOF'
sh_chk "chromium managed policy"       "test -f /etc/chromium/policies/managed/hardening.json"
sh_chk "chromium switches in chromium.conf" "grep -q '^DISABLE_FEATURES=\"OptimizationHints,' /etc/chromium/chromium.conf && grep -q 'disable-blink-features=AdInterestGroupAPI' /etc/chromium/chromium.conf"
sh_chk "avahi-daemon disabled (no mDNS)" "! systemctl is-enabled avahi-daemon.service avahi-daemon.socket 2>/dev/null | grep -qx enabled"
VERIFY_EOF
%end
