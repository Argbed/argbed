# 830-mpv: mpv with RPM Fusion's full libavcodec
# Fedora's ffmpeg-free has no H.264/HEVC decoders; libavcodec-freeworld
#   is the same soname with every decoder, placed ahead of the stock
#   library by an ld.so.conf.d entry; mpv itself comes from Fedora.
# The rpmfusion-free-release rpm is checked against the key Fedora ships
#   in distribution-gpg-keys before it installs; the repository metadata
#   is unsigned, so only packages are checked.
# hwdec=auto-safe uses the GPU's VA-API driver and falls back to software;
#   H.264/HEVC through VA-API needs mesa-va-drivers-freeworld on Mesa GPUs.

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
mpv
# URL/stream playback helper (weak dep, so opt-in):
#yt-dlp
%end

%post --erroronfail --log=/root/ks-post-830-mpv.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

rel=$(rpm -E %fedora)
# release rpm checked against Fedora's distribution-gpg-keys; dnf verifies
# the URL rpm (localpkg_gpgcheck is off by default)
dnf install -y distribution-gpg-keys
rpm --import "/usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-${rel}"
dnf remove -y distribution-gpg-keys
dnf install -y --setopt=localpkg_gpgcheck=1 "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-${rel}.noarch.rpm"
# https mirrors only: the installed system's egress drops port 80. Appended
# in place: the files are config(noreplace).
sed -i '/^metalink=/ { /protocol=https/! s/$/\&protocol=https/ }' /etc/yum.repos.d/rpmfusion-*.repo
dnf install -y libavcodec-freeworld

install -d -m 700 /etc/skel/.config/mpv
cat > /etc/skel/.config/mpv/mpv.conf << 'EOF'
# hardware decode where safe, silent software fallback otherwise
hwdec=auto-safe
EOF
chmod 600 /etc/skel/.config/mpv/mpv.conf
%end
