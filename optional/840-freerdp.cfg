# 840-freerdp: RDP client with a keymod-mask config for sdl-freerdp
# Installs freerdp and a per-user sdl-freerdp.json (SDL_KeyModMask).

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
freerdp
%end

%post --erroronfail --log=/root/ks-post-840-freerdp.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

SKEL=/etc/skel
install -d -m 700 "$SKEL/.config/freerdp"
cat > "$SKEL/.config/freerdp/sdl-freerdp.json" << 'EOF'
{
  "SDL_KeyModMask": ["KEYMOD_NONE"]
}
EOF
chmod 600 "$SKEL/.config/freerdp/sdl-freerdp.json"
%end
