# 850-claude-code: Claude Code from Anthropic's signed dnf repository
# curl fetches the signing key; rpm reads it into a scratch keyring, and
#   every key found there is compared with the pin below before import,
#   so a hostile mirror can neither substitute nor add a key; the repo
#   file points dnf at the pinned copy in /etc/pki/rpm-gpg, and
#   repo_gpgcheck=1: altered or unsigned metadata is refused.
# Updates arrive by dnf upgrade only; managed settings turn off usage
#   telemetry, crash reporting and the self-updater for every user
#   (/etc/claude-code/managed-settings.json). Needs egress 443.
# git: the agent's commit and diff tooling.
# The stable channel trails latest, selected by the baseurl's last part.
# Key fingerprint and channels: https://code.claude.com/docs/en/setup

%packages --nocore --exclude-weakdeps --excludedocs --inst-langs=en_US:en
curl
git
%end

%post --erroronfail --log=/root/ks-post-850-claude-code.log --interpreter=/usr/bin/bash
set -Eeuo pipefail
trap 'echo "ERROR: exit $? at line $LINENO: $BASH_COMMAND"' ERR
export PATH=/usr/sbin:/usr/bin:/sbin:/bin

# lowercase, as rpm names the imported key
PINNED_FPR="31ddde24ddfab679f42d7bd2baa929ff1a7ecace"

tmpkey=$(mktemp)
tmpdb=$(mktemp -d)
trap 'rm -rf "$tmpkey" "$tmpdb"' EXIT
curl --proto '=https' --tlsv1.2 -fsSL \
    https://downloads.claude.ai/keys/claude-code.asc -o "$tmpkey"

# a scratch rpm database lists every key the file holds, one name each
rpmkeys --dbpath "$tmpdb" --import "$tmpkey"
actual_fpr=$(rpm --dbpath "$tmpdb" -q gpg-pubkey --qf '%{VERSION}\n')
if [ "$actual_fpr" != "$PINNED_FPR" ]; then
    echo "ERROR: Claude Code signing key fingerprint mismatch!" >&2
    echo "  expected: $PINNED_FPR" >&2
    echo "  got:      $actual_fpr" >&2
    exit 1
fi

install -m 644 "$tmpkey" /etc/pki/rpm-gpg/RPM-GPG-KEY-claude-code
rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-claude-code

cat > /etc/yum.repos.d/claude-code.repo << 'EOF'
[claude-code]
name=Claude Code
baseurl=https://downloads.claude.ai/claude-code/rpm/stable
enabled=1
gpgcheck=1
repo_gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-claude-code
EOF
chmod 644 /etc/yum.repos.d/claude-code.repo

dnf install -y claude-code

mkdir -p /etc/claude-code
cat > /etc/claude-code/managed-settings.json << 'EOF'
{
    "env": {
        "DISABLE_TELEMETRY": "1",
        "DISABLE_ERROR_REPORTING": "1",
        "DISABLE_AUTOUPDATER": "1"
    }
}
EOF
chmod 644 /etc/claude-code/managed-settings.json
%end
